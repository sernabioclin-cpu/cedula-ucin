<script>window.CEDULA_DATA = {"modulos":[{"id":"M01","sheet":"M01_Gobernanza","nombre":"Gobernanza, vigilancia epidemiológica y brotes","objetivo":"Verificar que exista conducción, vigilancia activa y respuesta oportuna a brotes en la UCIN.","reactivos":[{"clave":"GOB-01","criterio":"El CODECIN (comité de detección y control de IAAS) sesiona al menos una vez al mes e incluye la UCIN como punto fijo de la orden del día.","cumpleSi":"Hay acta constitutiva vigente y 3 minutas de los últimos 3 meses; cada minuta trata tasas o eventos de la UCIN.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Programar sesiones mensuales con un punto fijo de UCIN (tasas, brotes, apego a paquetes, consumo de antimicrobianos). Cada acuerdo debe tener responsable y fecha de cumplimiento.","sustento":"PROY-NOM-045-SSA2-2026; Cédula CODECIN (índice de funcionalidad).","plazo":"≤90 días"},{"clave":"GOB-02","criterio":"La UVEH cuenta con epidemiólogo y enfermera en prevención y control de infecciones (PCI) con tiempo asignado a la UCIN.","cumpleSi":"Hay nombramientos vigentes y la bitácora muestra visita diaria de la enfermera PCI a la UCIN en los últimos 30 días.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Designar formalmente enfermera PCI con visita diaria a la UCIN y registrar la visita en bitácora.","sustento":"PROY-NOM-045-SSA2-2026; Componentes básicos de PCI OMS/OPS (componente 1).","plazo":"≤90 días"},{"clave":"GOB-03","criterio":"La UCIN tiene un líder médico y un líder de enfermería en PCI (\"campeones\") designados por escrito.","cumpleSi":"Existe oficio de designación de ambos líderes con funciones descritas.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Nombrar un líder médico y uno de enfermería por escrito, con funciones: auditar paquetes, retroalimentar al personal y enlazar con UVEH y PROA.","sustento":"CDC NICU CLABSI Guideline 2022 (equipos dedicados); OMS estrategia multimodal.","plazo":"≤90 días"},{"clave":"GOB-04","criterio":"Se realiza búsqueda activa diaria de IAAS en la UCIN con definiciones de caso RHOVE y se notifican los casos.","cumpleSi":"Hay registro de búsqueda activa de los últimos 30 días y los casos detectados aparecen notificados en RHOVE.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Implantar búsqueda activa diaria (expediente, laboratorio, censo) con definiciones RHOVE y notificar cada caso. Sin vigilancia confiable no es posible detectar brotes ni medir el efecto de las intervenciones.","sustento":"Manual RHOVE; PROY-NOM-045-SSA2-2026.","plazo":"Inmediato (≤30 días)"},{"clave":"GOB-05","criterio":"Se calculan mensualmente las tasas de ITS asociada a CVC por 1,000 días-catéter, NAV por 1,000 días-ventilador e IAAS por 1,000 días-paciente, estratificadas por peso al nacer.","cumpleSi":"Hay tasas de los últimos 12 meses con denominadores diarios (días-paciente, días-CVC, días-VM) y estratificación por peso: <750, 750–1000, 1001–1500, 1501–2500 y >2500 g.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Registrar diariamente días-paciente, días-CVC y días-VM; calcular tasas mensuales por estrato de peso y graficarlas. Capturar los datos en la hoja INDICADORES de esta cédula.","sustento":"Manual RHOVE; NHSN (estratificación por peso); ppt Ruta de revisión PCI en UCIN (tablero semanal).","plazo":"Inmediato (≤30 días)"},{"clave":"GOB-06","criterio":"Se usa gráfica de control o canal endémico por microorganismo para detectar brotes de forma oportuna.","cumpleSi":"Existe gráfica actualizada al último mes para los principales agentes (p. ej., K. pneumoniae, Candida, S. aureus).","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Elaborar gráfica de control mensual por agente y definir el umbral que activa el estudio de brote.","sustento":"ppt Ruta de revisión PCI en UCIN (Fase 1, densidad de incidencia y gráfica de control).","plazo":"≤90 días"},{"clave":"GOB-07","criterio":"Los brotes de los últimos 12 meses se notificaron en ≤24 h, se estudiaron y tienen informe de cierre.","cumpleSi":"Todos los brotes tienen notificación en ≤24 h, estudio de brote completo y acta de cierre. Marque N/A solo si no hubo brotes en 12 meses.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":true,"recomendacion":"Notificar todo brote en ≤24 h, completar el estudio (definición de caso, curva epidémica, tipificación) y cerrar formalmente cuando pasen 8 semanas sin casos ni conversiones.","sustento":"PROY-NOM-045-SSA2-2026; Manual RHOVE; ppt Ruta de revisión (criterio de cierre: 8 semanas sin casos).","plazo":"Inmediato (≤30 días)"},{"clave":"GOB-08","criterio":"Cada bacteriemia asociada a CVC y cada caso por microorganismo multirresistente (MDRO) tiene análisis de causa raíz con acciones.","cumpleSi":"Hay análisis de causa raíz documentado en ≥90% de los casos de los últimos 6 meses.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Realizar análisis de causa raíz de cada caso en ≤7 días con enfoque de sistema (no de culpables) y dar seguimiento a las acciones.","sustento":"ppt Ruta de revisión (análisis de causa raíz por cada bacteriemia); Propuesta ejecutiva Comando.","plazo":"≤60 días"},{"clave":"GOB-09","criterio":"El comité de mortalidad analiza si las defunciones neonatales se asocian a IAAS y establece acciones.","cumpleSi":"Hay minutas de los últimos 3 meses que clasifican la asociación de cada defunción con IAAS y registran acciones.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir en cada revisión de defunción neonatal la pregunta explícita sobre IAAS y RAM y derivar las acciones al CODECIN.","sustento":"Cédula CODECIN (letalidad por IAAS).","plazo":"≤90 días"},{"clave":"GOB-10","criterio":"La UCIN tiene un plan anual de PCI o matriz de riesgos con avance de acciones mayor al 75%.","cumpleSi":"Existe plan o matriz vigente y el avance documentado de sus acciones es >75%.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Elaborar matriz de riesgos de la UCIN (por ejemplo, AMEF o Ishikawa) con acciones, responsables y fechas, y revisarla trimestralmente.","sustento":"Cédula CODECIN (matriz de riesgos).","plazo":"≤90 días"},{"clave":"GOB-11","criterio":"Se retroalimenta cada mes al personal de la UCIN con tasas, apego a paquetes y consumo de antimicrobianos (tablero visible).","cumpleSi":"Hay un tablero visible en la UCIN actualizado en los últimos 30 días, o minutas de sesión de retroalimentación.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Colocar un tablero mensual visible en la UCIN (tasas, días sin bacteriemia, apego a higiene de manos y paquetes, DOT) y comentarlo en el cambio de turno.","sustento":"OMS componentes básicos PCI (componente 6: monitoreo y retroalimentación).","plazo":"≤90 días"},{"clave":"GOB-12","criterio":"No hubo desabasto de insumos críticos de PCI en los últimos 6 meses (solución alcohólica, jabón, toallas, guantes, apósitos, antisépticos, frascos de hemocultivo).","cumpleSi":"Ningún insumo crítico tuvo desabasto en 6 meses según almacén y entrevista a la jefa de enfermería.","verificar":"Entrevista","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Establecer inventario mínimo y punto de reorden para insumos críticos de PCI, con reporte inmediato a Dirección ante riesgo de desabasto.","sustento":"OMS componentes básicos PCI (componente 8); Propuesta ejecutiva Comando.","plazo":"≤60 días"},{"clave":"GOB-13","criterio":"Hay una ruta escrita de notificación y escalamiento para microorganismos multirresistentes, brotes y patrones inusuales de resistencia: laboratorio → UCIN y UVEH → Dirección → jurisdicción o estado → nivel federal, con plazo para cada paso.","cumpleSi":"La ruta existe, está firmada y define quién avisa a quién y en qué plazo; el personal de UVEH y laboratorio la conoce.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Emitir la ruta de notificación y escalamiento con plazos (resultado crítico al médico ≤1 h, alerta de multirresistente a UVEH ≤24 h, brote a jurisdicción ≤24 h) y difundirla.","sustento":"ENARAM (estrategia 2.4.2: alerta temprana de microorganismos con importancia en la RAM); PROY-NOM-045-SSA2-2026.","plazo":"≤90 días"},{"clave":"GOB-14","criterio":"Después de cada brote se hizo una revisión posterior (lecciones aprendidas) con plan de mejora y seguimiento de sus acciones.","cumpleSi":"Cada brote de los últimos 12 meses tiene informe de revisión posterior con acciones y avance. Marque N/A solo si no hubo brotes en 12 meses.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Hacer una revisión posterior al cierre de cada brote (qué falló en el sistema, qué funcionó) y convertirla en acciones con responsable y fecha.","sustento":"PROY-NOM-045-SSA2-2026 (estudio y control de brotes); ENARAM (estrategia 3.3.4: funcionamiento de los comités de IAAS).","plazo":"≤90 días"},{"clave":"GOB-15","criterio":"En los últimos 12 meses la UCIN hizo al menos un simulacro o ejercicio de respuesta ante brote por multirresistente o Candida (activación, cohortes, tamizaje, comunicación).","cumpleSi":"Hay guion, lista de participantes e informe con brechas identificadas.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Programar un ejercicio anual de respuesta a brote con UVEH, laboratorio, enfermería, limpieza y Dirección.","sustento":"ENARAM (estrategia 2.4.2: alerta temprana de microorganismos con importancia en la RAM); OMS, componentes básicos de PCI (preparación ante brotes).","plazo":"≤90 días"}]},{"id":"M02","sheet":"M02_HigieneManos","nombre":"Higiene de manos","objetivo":"Verificar el apego real a los 5 momentos y las condiciones para cumplirlos. La transmisión por manos del personal es la principal vía de brotes en UCIN.","reactivos":[{"clave":"HM-01","criterio":"El apego a higiene de manos observado durante esta visita es ≥90% (5 momentos OMS).","cumpleSi":"La hoja Obs_HM muestra apego ≥90% con al menos 30 oportunidades en 2 turnos. Parcial: 70–89%. No cumple: <70%.","verificar":"Hoja de observación","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Aplicar estrategia multimodal OMS: alcohol gel en cada cuna, observación mensual con retroalimentación inmediata, recordatorios en el punto de atención y participación de la Dirección. Meta ≥90%.","sustento":"OMS 5 momentos; ppt Ruta de revisión (meta ≥90%); Propuesta ejecutiva (meta ≥80%).","plazo":"Inmediato (≤30 días)"},{"clave":"HM-02","criterio":"La unidad mide el apego a higiene de manos al menos cada mes por observación directa en todos los turnos y comunica el resultado al personal.","cumpleSi":"Hay mediciones de los últimos 3 meses que incluyen los 3 turnos y evidencia de difusión.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Medir el apego cada mes en todos los turnos, con observadores capacitados, y presentar los resultados por categoría de personal.","sustento":"Programa Institucional de Higiene de Manos; OMS.","plazo":"≤90 días"},{"clave":"HM-03","criterio":"Hay dispensador de solución alcohólica (60–80%) funcional y con producto en cada cuna o punto de atención.","cumpleSi":"El 100% de las cunas revisadas tiene dispensador funcional con producto. Parcial: 80–99%.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Colocar un dispensador por cuna y asignar responsable de su reposición por turno.","sustento":"OMS; CDC NICU ICAR Supplement.","plazo":"Inmediato (≤30 días)"},{"clave":"HM-04","criterio":"Hay lavabos exclusivos para manos con jabón y toallas desechables a una distancia de 6 m o menos de cada cuna.","cumpleSi":"Todas las cunas tienen lavabo exclusivo de manos a ≤6 m con jabón y toallas disponibles.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Habilitar lavabos exclusivos para manos con jabón y toallas desechables; no usar estos lavabos para otro fin.","sustento":"AAP/ACOG Guidelines for Perinatal Care; CDC NICU ICAR Supplement.","plazo":"≤90 días"},{"clave":"HM-05","criterio":"Todo el personal observado tiene uñas cortas y naturales (sin esmalte ni uñas artificiales) y no usa anillos, reloj ni pulseras.","cumpleSi":"El 100% del personal observado durante la visita cumple. Parcial: 90–99%.","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Establecer política obligatoria de \"manos libres\" y uñas cortas naturales en la UCIN, con verificación al inicio de cada turno. Las uñas artificiales se asocian a brotes por Candida y gramnegativos.","sustento":"Propuesta ejecutiva Comando (brote de Candida por manos del personal); ppt (Candida: alcohol gel y uñas cortas).","plazo":"≤60 días"},{"clave":"HM-06","criterio":"El uso de guantes no sustituye la higiene de manos: el personal realiza higiene antes de colocarse y después de retirarse los guantes.","cumpleSi":"En la hoja Obs_HM no hay ninguna oportunidad marcada como \"guantes sin higiene\". Parcial: 1 o 2 casos.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Reforzar que los guantes no sustituyen la higiene de manos y que se cambian entre pacientes y entre sitios del mismo paciente.","sustento":"OMS; CDC.","plazo":"≤90 días"},{"clave":"HM-07","criterio":"Los familiares realizan higiene de manos al ingresar a la UCIN y antes de tocar al recién nacido, y se les enseña cómo hacerlo.","cumpleSi":"Se observa a los familiares hacerlo en todas las ocasiones vistas y hay material educativo visible a la entrada.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Instalar una estación de higiene de manos a la entrada con instructivo visual y enseñar la técnica a cada familia en el primer ingreso.","sustento":"CDC NICU ICAR Supplement (educación a familias).","plazo":"≤90 días"},{"clave":"HM-08","criterio":"La unidad aplica los 5 componentes de la estrategia multimodal OMS para higiene de manos.","cumpleSi":"Hay evidencia de los 5: cambio de sistema, capacitación, evaluación y retroalimentación, recordatorios, y clima de seguridad institucional.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Completar los componentes que falten de la estrategia multimodal; ninguna medida aislada es suficiente.","sustento":"OMS Estrategia multimodal; Propuesta ejecutiva (componente 5 OPS).","plazo":"≤90 días"}]},{"id":"M03","sheet":"M03_CateterCentral","nombre":"Catéter venoso central y umbilical (inserción y mantenimiento)","objetivo":"Verificar los paquetes de inserción y mantenimiento, que son las medidas con mayor efecto demostrado para reducir la bacteriemia asociada a catéter en neonatos.","reactivos":[{"clave":"CVC-01","criterio":"Se aplica lista de verificación en cada inserción de catéter central o umbilical, con un observador facultado para detener el procedimiento.","cumpleSi":"La lista está llena en ≥90% de 10 expedientes de pacientes con catéter revisados. Parcial: 70–89%.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Usar lista de verificación obligatoria en toda inserción; la enfermera observadora puede detener el procedimiento ante una falla de técnica.","sustento":"CDC NICU CLABSI Guideline 2022 (paquetes de inserción); Cédula CODECIN CVC.","plazo":"Inmediato (≤30 días)"},{"clave":"CVC-02","criterio":"En la inserción se usan barreras máximas: higiene de manos, gorro, cubrebocas, bata y guantes estériles, y campo estéril grande que cubre al recién nacido.","cumpleSi":"El protocolo lo indica y las listas de verificación revisadas lo registran en todas las inserciones.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Integrar un kit de inserción con todas las barreras y no iniciar el procedimiento si falta alguna.","sustento":"CDC NICU CLABSI Guideline 2022; NOM-022-SSA3-2012.","plazo":"Inmediato (≤30 días)"},{"clave":"CVC-03","criterio":"Existe protocolo escrito de antisepsia de la piel según edad gestacional y peso, con producto, técnica y tiempo de secado.","cumpleSi":"El protocolo indica el antiséptico por grupo (p. ej., clorhexidina con precaución en <28 semanas o <1,000 g por riesgo de quemadura química) y cómo retirarlo.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Elaborar protocolo de antisepsia neonatal: clorhexidina al 2% (alcohólica cuando el beneficio supere el riesgo) o yodopovidona, dejando secar y retirando el excedente con solución estéril en prematuros extremos.","sustento":"CDC NICU CLABSI Guideline 2022 (recomendación 5); NOM-022-SSA3-2012 6.5.1.","plazo":"≤90 días"},{"clave":"CVC-04","criterio":"Los catéteres son instalados por personal con competencia certificada o por un equipo de catéteres dedicado.","cumpleSi":"Hay registro de personal certificado y las inserciones revisadas fueron hechas por ese personal.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Certificar las competencias de inserción con simulación y supervisión, o crear un equipo de catéteres dedicado.","sustento":"CDC NICU CLABSI Guideline 2022 (recomendación 1: equipo dedicado).","plazo":"≤90 días"},{"clave":"CVC-05","criterio":"La necesidad del catéter se evalúa y registra cada día, y se retira cuando la alimentación enteral alcanza 100–120 mL/kg/día o termina la indicación.","cumpleSi":"En la hoja Obs_CVC el 100% de los pacientes tiene la necesidad registrada hoy y ninguno tiene catéter sin indicación.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Incluir en el pase de visita diario la pregunta \"¿este catéter sigue siendo necesario?\" y retirar en cuanto deje de serlo. Cada día-catéter adicional aumenta el riesgo.","sustento":"CDC NICU CLABSI Guideline 2022; Cédula CODECIN CVC (reactivo 5); ppt (retiro temprano de CVC).","plazo":"≤60 días"},{"clave":"CVC-06","criterio":"Antes de cada acceso se desinfecta el conector o puerto por fricción con alcohol al 70% (o clorhexidina alcohólica) durante 5 a 15 segundos y se deja secar.","cumpleSi":"Se observa en todos los accesos vistos durante la visita (mínimo 3 observaciones). Parcial: se hace pero con tiempo menor o sin secado.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Capacitar y auditar la técnica \"frotar el conector\" (scrub the hub) en cada acceso; considerar tapones con alcohol si están disponibles.","sustento":"CDC NICU CLABSI Guideline 2022 (mantenimiento); Cédula CODECIN CVC (reactivo 3).","plazo":"Inmediato (≤30 días)"},{"clave":"CVC-07","criterio":"El apósito es estéril, está limpio, seco, adherido y fechado, y se cambia según norma (transparente cada 7 días, gasa cada 48 h) o antes si está húmedo, sucio o despegado.","cumpleSi":"En la hoja Obs_CVC el 100% de los apósitos cumple. Parcial: 80–99%.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Estandarizar el tipo de apósito, el rotulado con fecha y la curación con técnica aséptica.","sustento":"NOM-022-SSA3-2012 6.11.2; Cédula CODECIN CVC (reactivo 2).","plazo":"≤90 días"},{"clave":"CVC-08","criterio":"Los equipos de infusión se cambian según la solución: nutrición parenteral, lípidos y hemoderivados cada 24 h; otras soluciones cada 72 h; todos rotulados.","cumpleSi":"En la hoja Obs_CVC el 100% de los equipos está dentro de tiempo y rotulado.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Rotular cada equipo con fecha y hora de instalación y verificar en cada turno su vigencia.","sustento":"NOM-022-SSA3-2012 6.3.8; Cédula CODECIN CVC (reactivo 4).","plazo":"≤90 días"},{"clave":"CVC-09","criterio":"Se minimiza la manipulación de la línea: sistema cerrado, conectores sin aguja, agrupación de medicamentos y sin toma rutinaria de muestras por el catéter.","cumpleSi":"Se observan los 4 elementos en los pacientes con catéter.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Reducir accesos: agrupar medicamentos, usar sistema cerrado y tomar muestras por el catéter solo según protocolo.","sustento":"CDC NICU CLABSI Guideline 2022; ppt (manipulación de líneas).","plazo":"≤90 días"},{"clave":"CVC-10","criterio":"Ningún catéter umbilical activo excede su límite: arterial ≤5 días y venoso ≤14 días (ideal ≤7 días).","cumpleSi":"En la hoja Obs_CVC ningún catéter umbilical excede el límite.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Programar desde la instalación la fecha de retiro del catéter umbilical y, si se requiere acceso prolongado, cambiar oportunamente a PICC.","sustento":"CDC Guidelines for the Prevention of Intravascular Catheter-Related Infections (umbilicales).","plazo":"≤60 días"},{"clave":"CVC-11","criterio":"El apego global al paquete de mantenimiento (todo o nada) es ≥95%.","cumpleSi":"La hoja Obs_CVC muestra apego todo o nada ≥95%. Parcial: 80–94%.","verificar":"Hoja de observación","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Auditar diariamente el paquete de mantenimiento con lista todo o nada y retroalimentar en el momento a quien atiende al paciente.","sustento":"ppt Ruta de revisión (meta ≥95%); CDC NICU CLABSI Guideline 2022 (recomendación 2).","plazo":"Inmediato (≤30 días)"},{"clave":"CVC-12","criterio":"No se usan infusiones antimicrobianas ni anticoagulantes profilácticos para prevenir bacteriemia; los candados antimicrobianos solo se usan con protocolo aprobado ante tasas persistentemente altas.","cumpleSi":"No hay órdenes de profilaxis de este tipo en el censo, o existe protocolo aprobado por CODECIN/PROA para candados.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Suspender profilaxis antimicrobiana o anticoagulante por catéter; reservar los candados antimicrobianos para brotes persistentes con protocolo aprobado.","sustento":"CDC NICU CLABSI Guideline 2022 (recomendaciones 3, 4 y 8).","plazo":"≤90 días"}]},{"id":"M04","sheet":"M04_Ventilacion","nombre":"Ventilación mecánica y apoyo respiratorio mínimamente invasivo","objetivo":"Verificar que se evite la intubación cuando sea posible, se acorte la ventilación y se apliquen las medidas para prevenir NAV.","reactivos":[{"clave":"VM-01","criterio":"Hay protocolo escrito de apoyo respiratorio no invasivo primero (CPAP o VNI desde sala de partos) y de surfactante por técnica mínimamente invasiva (LISA/MIST o INSURE) cuando está indicado.","cumpleSi":"El protocolo existe y en el censo los prematuros con respiración espontánea están en CPAP/VNI salvo indicación documentada de intubación.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Adoptar CPAP temprano y técnica mínimamente invasiva para surfactante. Cada día de ventilación invasiva evitado reduce el riesgo de NAV y de displasia.","sustento":"Guías europeas de SDR (consenso 2022/2023); estrategia de mínima invasión.","plazo":"≤60 días"},{"clave":"VM-02","criterio":"La posibilidad de extubación se evalúa y registra cada día en todo paciente con ventilación invasiva.","cumpleSi":"En la hoja Obs_VM el 100% de los pacientes tiene la evaluación registrada hoy. Marque N/A solo si no hay pacientes ventilados ni registros de los últimos 30 días.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":true,"recomendacion":"Incluir en el pase de visita la evaluación diaria de extubación con criterios escritos.","sustento":"Cédula CODECIN NAV (reactivo 4); ppt (extubación diaria).","plazo":"≤60 días"},{"clave":"VM-03","criterio":"La cabecera está elevada entre 10° y 30° salvo contraindicación documentada.","cumpleSi":"En la hoja Obs_VM el 100% de los pacientes ventilados cumple.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Marcar el ángulo en la incubadora o cuna y verificarlo en cada turno.","sustento":"Cédula CODECIN NAV (reactivo 2: 10°–15° en neonatos).","plazo":"≤90 días"},{"clave":"VM-04","criterio":"La aspiración de secreciones se hace solo cuando es necesaria, con sistema cerrado y sin instilar solución salina de rutina.","cumpleSi":"Se observa la técnica en al menos 1 aspiración o se verifica en hoja Obs_VM; el sistema cerrado está instalado en todos los pacientes ventilados.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Usar sistema cerrado de aspiración y aspirar solo por razón necesaria.","sustento":"Cédula CODECIN NAV (reactivo 5).","plazo":"≤90 días"},{"clave":"VM-05","criterio":"Se da cuidado oral cada 3 a 6 h con calostro o leche de la propia madre (o agua estéril si no hay) a los pacientes ventilados.","cumpleSi":"Hay registro del cuidado oral en las últimas 6 h en el 100% de los pacientes ventilados.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Integrar el cuidado oral con calostro o leche materna al paquete de NAV y registrarlo en la hoja de enfermería.","sustento":"Cédula CODECIN NAV (reactivo 6); revisión sistemática de calostro en prematuros (Slouha 2023).","plazo":"≤90 días"},{"clave":"VM-06","criterio":"Los circuitos no se cambian de rutina (solo si están sucios o fallan), el condensado se drena sin abrir el circuito y lejos del paciente, y el humidificador usa agua estéril.","cumpleSi":"Se observan los 3 elementos en todos los ventiladores en uso.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Estandarizar el manejo de circuitos y del condensado; usar solo agua estéril en humidificadores.","sustento":"CDC; Cédula CODECIN NAV (reactivo 7).","plazo":"≤90 días"},{"clave":"VM-07","criterio":"Las hojas de laringoscopio y las bolsas autoinflables reutilizables reciben desinfección de alto nivel (o son de un solo uso) y se guardan protegidas.","cumpleSi":"Hay bitácora de desinfección de alto nivel y el equipo listo para uso está empaquetado o cubierto.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Enviar este equipo a desinfección de alto nivel después de cada uso y guardarlo empaquetado.","sustento":"Cédula CODECIN NAV (reactivo 1 y nota).","plazo":"≤90 días"},{"clave":"VM-08","criterio":"Las extubaciones no planeadas y las reintubaciones se registran y analizan.","cumpleSi":"Hay registro de los últimos 3 meses con análisis.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":true,"recomendacion":"Registrar y analizar cada extubación no planeada; reducirlas evita reintubaciones y días de ventilación.","sustento":"Buenas prácticas de calidad en UCIN.","plazo":"≤90 días"}]},{"id":"M05","sheet":"M05_MinimaInvasion","nombre":"Mínima invasión y manejo de dispositivos","objetivo":"Verificar que se reduzcan los procedimientos invasivos, las punciones y los factores que favorecen sepsis tardía y candidiasis.","reactivos":[{"clave":"MIN-01","criterio":"Existe y se aplica un protocolo de manipulación mínima: agrupación de cuidados y registro del número de punciones por paciente.","cumpleSi":"El protocolo existe y la hoja de enfermería registra las punciones en los pacientes revisados.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Agrupar cuidados y procedimientos, registrar cada punción y fijar un máximo de intentos por operador.","sustento":"Johnson et al., Clin Perinatol 2021 (prevención de infecciones en UCIN).","plazo":"≤90 días"},{"clave":"MIN-02","criterio":"Las muestras de laboratorio se agrupan, se usa microtécnica y no hay estudios de rutina diarios sin indicación.","cumpleSi":"En 5 expedientes revisados no hay estudios diarios repetidos sin indicación clínica escrita.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Definir qué estudios requieren indicación diaria y usar microtécnica para reducir punciones y transfusiones.","sustento":"Johnson et al., Clin Perinatol 2021; stewardship diagnóstico.","plazo":"≤90 días"},{"clave":"MIN-03","criterio":"No hay pacientes con inhibidores de bomba de protones ni bloqueadores H2 sin indicación documentada.","cumpleSi":"En la hoja Obs_Censo ningún paciente tiene IBP o anti-H2 sin indicación escrita.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Suspender IBP y anti-H2 sin indicación precisa: aumentan sepsis tardía, enterocolitis necrosante y candidiasis invasiva.","sustento":"ppt Ruta de revisión (Candida: evitar bloqueadores H2 e IBP).","plazo":"≤60 días"},{"clave":"MIN-04","criterio":"Hay protocolo de alimentación enteral temprana (inicio trófico en las primeras 24–48 h con leche humana) y avance estandarizado.","cumpleSi":"El protocolo existe y en 5 expedientes de prematuros el inicio fue ≤48 h salvo contraindicación documentada.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Iniciar alimentación trófica con leche humana en ≤48 h y avanzar con protocolo; así se acortan los días de NPT y de catéter central.","sustento":"ppt (leche humana como factor protector); Haaland 2025 (mejora de nutrición y sepsis).","plazo":"≤60 días"},{"clave":"MIN-05","criterio":"Se prefiere acceso periférico o PICC; no se hacen venodisecciones salvo excepción documentada.","cumpleSi":"No hay venodisecciones en los últimos 3 meses sin justificación escrita.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Capacitar en inserción de PICC (idealmente guiada por ultrasonido) y eliminar la venodisección como acceso de rutina.","sustento":"CDC NICU CLABSI Guideline 2022.","plazo":"≤90 días"},{"clave":"MIN-06","criterio":"Hay protocolo de cuidado de la piel: mínimo uso de adhesivos con técnica de retiro segura, humedad en incubadora para <30 semanas y prevención de lesiones.","cumpleSi":"El protocolo existe y no se observan lesiones por adhesivos en los pacientes revisados.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Implantar protocolo de cuidado de la piel; la piel lesionada es puerta de entrada de bacteriemia.","sustento":"CDC NICU ICAR Supplement (adhesivos médicos); Johnson et al. 2021.","plazo":"≤90 días"},{"clave":"MIN-07","criterio":"Todos los dispositivos (sondas, drenajes, catéteres periféricos) se revisan cada día para retirarlos en cuanto no se necesiten.","cumpleSi":"En el pase de visita o en la hoja de enfermería hay revisión diaria de dispositivos.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir en la lista de pase de visita la revisión de cada dispositivo y su fecha de instalación.","sustento":"Johnson et al. 2021.","plazo":"≤90 días"}]},{"id":"M06","sheet":"M06_NPT_Medicamentos","nombre":"Nutrición parenteral, medicamentos y técnica aséptica","objetivo":"Verificar la preparación y administración segura de NPT, lípidos y medicamentos, fuente frecuente de brotes por gramnegativos y Candida.","reactivos":[{"clave":"NPT-01","criterio":"La nutrición parenteral se prepara en central de mezclas o en campana de flujo laminar con técnica aséptica; no se prepara en la cabecera.","cumpleSi":"Se verifica en el área de preparación y no hay NPT preparada fuera de campana.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Preparar toda NPT en central de mezclas o campana certificada. Si no existe, gestionarla con prioridad y mientras tanto usar área exclusiva con técnica aséptica estricta.","sustento":"Propuesta ejecutiva Comando (eje 5, crítico); ppt (NPT: campana, cadena de frío).","plazo":"Inmediato (≤30 días)"},{"clave":"NPT-02","criterio":"Las emulsiones de lípidos se infunden en ≤12 h cuando se fraccionan fuera del envase original y en ≤24 h en su envase; la NPT se cambia cada 24 h.","cumpleSi":"Las etiquetas de las infusiones en uso muestran tiempos dentro de límite.","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Rotular hora de inicio en lípidos y NPT y desecharlos al cumplir el tiempo máximo.","sustento":"CDC; NOM-022-SSA3-2012 6.3.8.","plazo":"≤60 días"},{"clave":"NPT-03","criterio":"Los viales multidosis se usan para un solo paciente o, si se comparten, se preparan fuera del entorno del paciente, se fechan al abrirse y se desechan a los 28 días o según fabricante; los viales unidosis no se usan en más de un paciente.","cumpleSi":"Todos los viales abiertos revisados cumplen.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Prohibir el uso de viales unidosis en varios pacientes y fechar todo vial multidosis al abrirlo.","sustento":"CDC Safe Injection Practices; Propuesta ejecutiva (uso de multidosis).","plazo":"Inmediato (≤30 días)"},{"clave":"NPT-04","criterio":"Hay área limpia de preparación de medicamentos separada al menos 1 m de lavabos (zona de salpicadura) o con barrera, y se desinfecta antes de preparar.","cumpleSi":"El área está separada o protegida y se observa su desinfección.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Reubicar el área de preparación fuera de la zona de salpicadura o colocar una barrera; desinfectarla antes de cada preparación.","sustento":"CDC NICU ICAR Supplement (zona de salpicadura de lavabos).","plazo":"≤90 días"},{"clave":"NPT-05","criterio":"Se desinfecta el tapón de viales y ampolletas con alcohol al 70% antes de puncionar y se usan aguja y jeringa nuevas en cada acceso.","cumpleSi":"Se observa en todas las preparaciones vistas (mínimo 2).","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Capacitar y auditar la técnica aséptica en la preparación de medicamentos.","sustento":"CDC Safe Injection Practices.","plazo":"≤60 días"},{"clave":"NPT-06","criterio":"No se usan bolsas o frascos de solución como fuente común para varios pacientes.","cumpleSi":"No se encuentra ninguna solución compartida.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Eliminar los frascos o bolsas compartidos: cada paciente debe tener su propia solución.","sustento":"CDC Safe Injection Practices; experiencias de brotes en UCIN.","plazo":"Inmediato (≤30 días)"},{"clave":"NPT-07","criterio":"Todas las mezclas e infusiones están rotuladas con paciente, contenido, hora de preparación y caducidad.","cumpleSi":"El 100% de las infusiones revisadas está rotulado.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Usar etiqueta estandarizada para toda mezcla e infusión.","sustento":"Acciones Esenciales para la Seguridad del Paciente.","plazo":"≤90 días"},{"clave":"NPT-08","criterio":"El refrigerador de medicamentos tiene bitácora de temperatura (2–8 °C) llena dos veces al día.","cumpleSi":"La bitácora de los últimos 30 días está completa y dentro de rango.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Registrar la temperatura dos veces al día y definir qué hacer si sale de rango.","sustento":"Buenas prácticas de farmacia hospitalaria.","plazo":"≤90 días"}]},{"id":"M07","sheet":"M07_LecheHumana","nombre":"Leche humana, calostro y lactario","objetivo":"Verificar el uso prioritario de leche humana y calostro orofaríngeo, y el manejo seguro de la leche y los extractores.","reactivos":[{"clave":"LH-01","criterio":"Existe política escrita: leche de la propia madre como primera opción, leche humana donada pasteurizada como segunda, y fórmula solo cuando no hay leche humana.","cumpleSi":"La política existe, está firmada y el personal entrevistado la conoce.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Emitir política de alimentación con leche humana y difundirla. La leche humana reduce sepsis tardía, enterocolitis necrosante y mortalidad.","sustento":"Haaland 2025 (mortalidad 11% a 5.5% con banco de leche y capacitación); IHAN.","plazo":"≤60 días"},{"clave":"LH-02","criterio":"Los recién nacidos <32 semanas o <1,500 g (o en ayuno) reciben calostro orofaríngeo en las primeras 24 h, 0.1–0.2 mL cada 2–3 h.","cumpleSi":"Hay protocolo y en la hoja Obs_Censo ≥80% de los elegibles lo inició en ≤24 h. Parcial: 50–79%.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Implantar protocolo de inmunoterapia orofaríngea con calostro desde las primeras horas: es segura, barata y mejora la tolerancia y la microbiota.","sustento":"Slouha et al. 2023, revisión sistemática de calostro en prematuros.","plazo":"≤60 días"},{"clave":"LH-03","criterio":"Las madres reciben apoyo para extraer leche desde las primeras 6 h después del parto (ideal en la primera hora) y al menos 8 veces al día, con consejería en lactancia.","cumpleSi":"Hay consejería disponible todos los días y 2 madres entrevistadas confirman el apoyo.","verificar":"Entrevista","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Garantizar extractor, sala de extracción y consejería desde el nacimiento; la extracción temprana define la producción posterior.","sustento":"IHAN; Haaland 2025.","plazo":"≤60 días"},{"clave":"LH-04","criterio":"La sala de extracción (lactario) está limpia, tiene lavabo e insumos de higiene de manos, superficies lavables y está fuera de la zona de salpicadura.","cumpleSi":"Se verifican los 4 elementos.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Adecuar el lactario con lavabo, superficies lavables y limpieza programada.","sustento":"CDC NICU ICAR Supplement (lactario).","plazo":"≤90 días"},{"clave":"LH-05","criterio":"Los extractores y sus piezas se limpian y desinfectan o esterilizan entre usos, cada madre tiene su kit, y se secan y guardan protegidos.","cumpleSi":"Se verifica el proceso, la existencia de kits individuales y su almacenamiento limpio y seco.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Usar kits individuales, procesar las piezas según instrucciones del fabricante y guardarlas secas y cubiertas. Los extractores mal procesados han causado brotes graves.","sustento":"CDC NICU ICAR Supplement; Propuesta ejecutiva (manejo de leche humana en brotes).","plazo":"Inmediato (≤30 días)"},{"clave":"LH-06","criterio":"Toda la leche está rotulada (nombre e identificación del RN, fecha y hora de extracción, caducidad) y se verifica por dos personas o código de barras antes de administrarla.","cumpleSi":"El 100% de los frascos revisados está rotulado y se observa o documenta la doble verificación.","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Estandarizar etiqueta y doble verificación antes de cada toma para evitar dar leche de otra madre.","sustento":"CDC NICU ICAR Supplement.","plazo":"≤60 días"},{"clave":"LH-07","criterio":"El refrigerador de leche es exclusivo, tiene bitácora de temperatura dos veces al día (refrigeración 2–4 °C; congelación ≤-18 °C) y se aplica \"primero en entrar, primero en salir\".","cumpleSi":"Se verifican los 3 elementos.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Destinar refrigerador exclusivo con bitácora y alarma, y organizar la leche por fecha.","sustento":"CDC NICU ICAR Supplement.","plazo":"≤90 días"},{"clave":"LH-08","criterio":"La leche se descongela y calienta sin agua no estéril (calentador seco o bolsa sellada), nunca en microondas, y la leche descongelada se usa en ≤24 h.","cumpleSi":"Se observa el método y no se usa agua del grifo ni microondas.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Usar calentadores secos o baño con bolsa sellada y desechar la leche descongelada a las 24 h.","sustento":"CDC NICU ICAR Supplement (descongelación y calentamiento).","plazo":"≤90 días"},{"clave":"LH-09","criterio":"En alimentación continua, la jeringa y el equipo se cambian al menos cada 4 h.","cumpleSi":"Las jeringas en uso tienen hora de inicio de ≤4 h.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Rotular hora de inicio y cambiar jeringa y equipo cada 4 h.","sustento":"CDC NICU ICAR Supplement (tiempo máximo de colgado 4 h).","plazo":"≤90 días"},{"clave":"LH-10","criterio":"Si se usa fórmula en polvo, se prepara con técnica aséptica en área designada con agua ≥70 °C y se usa en ≤24 h refrigerada; en prematuros se prefiere fórmula líquida estéril.","cumpleSi":"Se verifica el área y el procedimiento. Marque N/A si no se usa fórmula en polvo.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":true,"recomendacion":"Preferir fórmula líquida estéril en prematuros; si se usa polvo, prepararla en área designada con agua ≥70 °C.","sustento":"CDC NICU ICAR Supplement (fórmula en polvo).","plazo":"≤90 días"},{"clave":"LH-11","criterio":"La unidad tiene banco de leche humana o acceso a leche donada pasteurizada con trazabilidad.","cumpleSi":"Existe banco propio o convenio vigente con trazabilidad de cada frasco.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Gestionar banco de leche o convenio con uno; priorizar a los <1,500 g sin leche de su madre.","sustento":"Haaland 2025 (banco de leche en hospital público).","plazo":"≤90 días"},{"clave":"LH-12","criterio":"Al menos 80% de los recién nacidos que se alimentan reciben leche humana (exclusiva o mixta).","cumpleSi":"La hoja Obs_Censo muestra ≥80%. Parcial: 60–79%.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Analizar por qué cada RN no recibe leche humana y resolver las barreras (acceso de la madre, extracción, banco).","sustento":"Haaland 2025.","plazo":"≤90 días"}]},{"id":"M08","sheet":"M08_Familia_Canguro","nombre":"Acompañamiento familiar y Método Madre Canguro","objetivo":"Verificar el acceso de la familia, su participación en el cuidado y el contacto piel a piel, intervenciones que reducen mortalidad y sepsis.","reactivos":[{"clave":"FAM-01","criterio":"La madre y el padre (o cuidador principal) pueden estar en la UCIN las 24 h sin restricción de horario.","cumpleSi":"La política escrita lo permite y en la visita se observa o se confirma con 2 familias.","verificar":"Entrevista","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Abrir la UCIN las 24 h a madre y padre: son parte del equipo de cuidado, no visitas.","sustento":"OMS 2022 Recomendaciones para el cuidado del RN prematuro o de bajo peso; ensayo iKMC (NEJM 2021).","plazo":"≤60 días"},{"clave":"FAM-02","criterio":"Hay protocolo escrito de Método Madre Canguro (contacto piel a piel) que incluye a RN estables con dispositivos (CPAP, catéteres, ventilación estable).","cumpleSi":"El protocolo existe y define elegibilidad, posición, monitoreo y traslado seguro con dispositivos.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Emitir protocolo de MMC que incluya a pacientes con dispositivos y capacitar al personal para colocarlos de forma segura.","sustento":"Ensayo iKMC (NEJM 2021): MMC inmediato redujo la mortalidad neonatal 25% (RR 0.75) en RN de 1.0 a <1.8 kg.","plazo":"≤60 días"},{"clave":"FAM-03","criterio":"Los RN elegibles reciben contacto piel a piel en promedio ≥8 h al día.","cumpleSi":"La hoja Obs_Censo muestra promedio ≥8 h en elegibles. Parcial: 2 a 7.9 h. No cumple: <2 h.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Aumentar progresivamente las horas de MMC (meta: lo más continuo posible); en el ensayo iKMC el grupo intervenido tuvo 16.9 h/día.","sustento":"Ensayo iKMC (NEJM 2021); OMS 2022.","plazo":"≤60 días"},{"clave":"FAM-04","criterio":"Hay un sillón reclinable por cuna y espacio de descanso y alimentación para las madres (estancia o albergue).","cumpleSi":"Se verifica sillón por cuna y área de estancia materna.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Habilitar sillones reclinables y estancia materna; sin ellas el MMC prolongado no es posible.","sustento":"OMS 2022; IHAN.","plazo":"≤90 días"},{"clave":"FAM-05","criterio":"Las familias reciben educación estructurada y registrada sobre higiene de manos, uñas y joyas, signos de alarma, extracción de leche y cuidado canguro.","cumpleSi":"Hay registro de educación en los expedientes revisados y 2 familias entrevistadas lo confirman.","verificar":"Entrevista","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Usar un programa breve de educación por etapas al ingreso, durante la estancia y al egreso, con registro.","sustento":"CDC NICU ICAR Supplement (educación a familias).","plazo":"≤90 días"},{"clave":"FAM-06","criterio":"A los familiares se les pregunta por síntomas al ingresar (fiebre, tos, diarrea, lesiones, exantema, contacto con varicela o sarampión) y hay conducta definida.","cumpleSi":"Existe el filtro con registro y conducta escrita.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Instalar filtro de síntomas al ingreso; ante síntomas, orientar sin prohibir el contacto si puede protegerse (cubrebocas, higiene).","sustento":"CDC NICU ICAR Supplement (restricciones de visitantes).","plazo":"≤90 días"},{"clave":"FAM-07","criterio":"Los padres participan activamente en los cuidados (cambio de pañal, alimentación, MMC, pase de visita), según el modelo de cuidado integrado a la familia.","cumpleSi":"Se observa o se documenta la participación en al menos 2 actividades por familia.","verificar":"Entrevista","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Adoptar el modelo de cuidado integrado a la familia con capacitación de padres y participación en el pase de visita.","sustento":"OMS 2022 (participación familiar).","plazo":"≤90 días"},{"clave":"FAM-08","criterio":"Se promueve la vacunación de los familiares cercanos (influenza, tos ferina, COVID-19).","cumpleSi":"Hay material o registro de orientación sobre vacunación.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Orientar a las familias sobre vacunación y referirlas al módulo de vacunación.","sustento":"Recomendaciones de vacunación de contactos de RN.","plazo":"≤90 días"}]},{"id":"M09","sheet":"M09_Precauciones_MDRO","nombre":"Precauciones, tamizaje de multirresistentes y cohortes","objetivo":"Verificar que se detecte y contenga la transmisión de bacterias multirresistentes (p. ej., K. pneumoniae resistente a carbapenémicos) y Candida.","reactivos":[{"clave":"PRE-01","criterio":"Las precauciones estándar y por mecanismo de transmisión se indican por escrito, están señalizadas en la cuna y coinciden con lo que se hace.","cumpleSi":"En todos los pacientes con precauciones revisados hay indicación, tarjeta visible y práctica congruente.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Indicar, señalizar y verificar en cada turno las precauciones; retirarlas solo con criterio escrito.","sustento":"Cédula CODECIN Precauciones.","plazo":"≤90 días"},{"clave":"PRE-02","criterio":"En las cunas con precauciones de contacto hay bata y guantes disponibles y el personal los coloca y retira correctamente.","cumpleSi":"Se observan insumos completos y uso correcto en todas las observaciones (mínimo 3).","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":true,"recomendacion":"Colocar insumos en cada cuna con precauciones y capacitar en colocación y retiro.","sustento":"ppt (precauciones de contacto: bata, guantes, equipo dedicado).","plazo":"≤60 días"},{"clave":"PRE-03","criterio":"Se toma tamizaje rectal de colonización por enterobacterias resistentes a carbapenémicos al ingreso de todo RN referido o con hospitalización previa, y cada semana a todos cuando hubo casos en los últimos 12 meses.","cumpleSi":"La cobertura de tamizaje es ≥95% (hoja INDICADORES). Parcial: 80–94%.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Implantar tamizaje de ingreso y semanal con medio cromogénico o PCR, y actuar con el resultado (cohorte). Sin tamizaje la transmisión silenciosa continúa.","sustento":"ppt Ruta de revisión (vigilancia activa CRKP; cobertura ≥95%).","plazo":"Inmediato (≤30 días)"},{"clave":"PRE-04","criterio":"Los pacientes colonizados o infectados por multirresistentes se agrupan en cohorte geográfica con personal de enfermería dedicado en cada turno.","cumpleSi":"Se verifica la cohorte y el rol de personal. Marque N/A solo si no hay pacientes colonizados ni infectados hoy.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":true,"recomendacion":"Agrupar a portadores, contactos y no expuestos en zonas separadas, con personal dedicado por turno.","sustento":"ppt (cohorte geográfica con personal dedicado).","plazo":"Inmediato (≤30 días)"},{"clave":"PRE-05","criterio":"Cada cuna tiene equipo de uso exclusivo (estetoscopio, termómetro, cinta métrica, brazalete) y el equipo compartido se desinfecta entre pacientes.","cumpleSi":"Se verifica en todas las cunas revisadas y se observa la desinfección del equipo compartido.","verificar":"Observación directa","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Dotar equipo individual por cuna y desinfectar el compartido (ultrasonido, básculas, oxímetros) entre cada paciente.","sustento":"ppt (equipo exclusivo por cuna); Propuesta ejecutiva.","plazo":"≤60 días"},{"clave":"PRE-06","criterio":"El estado de portador de multirresistentes se comunica en traslados internos y externos y queda como alerta en el expediente.","cumpleSi":"Las hojas de referencia o traslado de portadores revisadas lo incluyen.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir el estado de portador en la hoja de traslado y avisar a la unidad receptora.","sustento":"ppt (ingresos y traslados: estado de portador comunicado).","plazo":"≤90 días"},{"clave":"PRE-07","criterio":"Hay política escrita que excluye de la atención directa al personal con enfermedad transmisible (respiratoria, diarrea, herpes labial, lesiones en manos).","cumpleSi":"La política existe y el personal entrevistado la conoce.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Emitir política de exclusión temporal con reporte sin sanción.","sustento":"CDC NICU ICAR Supplement.","plazo":"≤90 días"},{"clave":"PRE-08","criterio":"Al menos 90% del personal de la UCIN tiene esquema de vacunación registrado (influenza, hepatitis B, sarampión, Tdpa).","cumpleSi":"El registro muestra ≥90%.","verificar":"Revisión documental","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Completar la vacunación del personal mediante campaña en el servicio.","sustento":"Recomendaciones de vacunación de trabajadores de la salud.","plazo":"≤90 días"}]},{"id":"M10","sheet":"M10_Ambiente_Agua","nombre":"Ambiente, agua, lavabos, incubadoras y equipo","objetivo":"Verificar las fuentes ambientales de brotes en UCIN: lavabos y drenajes, agua, incubadoras y superficies.","reactivos":[{"clave":"AMB-01","criterio":"Hay programa de limpieza y desinfección: concurrente diaria de superficies de alto contacto alrededor de cada cuna y terminal al egreso, con desinfectantes con registro COFEPRIS y respetando su tiempo de contacto.","cumpleSi":"El programa existe, los desinfectantes tienen registro y ficha técnica, y se observa el tiempo de contacto.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Elaborar programa con frecuencias, responsables, productos y tiempos de contacto; verificar con lista diaria.","sustento":"Cédula CODECIN Limpieza y desinfección.","plazo":"≤60 días"},{"clave":"AMB-02","criterio":"Al menos 85% de las superficies verificadas con marcador fluorescente o ATP están conformes.","cumpleSi":"La hoja Obs_Amb muestra ≥85%. Parcial: 70–84%.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Verificar la limpieza con marcador o ATP cada semana y retroalimentar al personal de limpieza y enfermería.","sustento":"ppt Ruta de revisión (superficies conformes ≥85%).","plazo":"≤60 días"},{"clave":"AMB-03","criterio":"Las incubadoras se limpian y desinfectan entre pacientes y se cambian al menos cada 7 días (o según fabricante) en estancias prolongadas, con registro y en área designada.","cumpleSi":"Hay bitácora de uso y limpieza por incubadora y las limpias están identificadas.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Llevar bitácora por incubadora (paciente, fechas, limpieza terminal) y área designada para su limpieza.","sustento":"CDC NICU ICAR Supplement (incubadoras); Propuesta ejecutiva (eje 6, crítico).","plazo":"Inmediato (≤30 días)"},{"clave":"AMB-04","criterio":"Los humidificadores de incubadora usan solo agua estéril, que se cambia según fabricante, y el depósito se vacía y desinfecta.","cumpleSi":"Todas las incubadoras con humidificador revisadas cumplen; nunca se usa agua del grifo.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":true,"recomendacion":"Usar exclusivamente agua estéril y establecer frecuencia de cambio y desinfección del depósito.","sustento":"CDC NICU ICAR Supplement (humidificadores).","plazo":"Inmediato (≤30 días)"},{"clave":"AMB-05","criterio":"En los lavabos de manos no se desechan líquidos (leche, medicamentos, soluciones) y no hay insumos a menos de 1 m sin barrera; los sifones tienen limpieza programada.","cumpleSi":"Se verifican los 3 elementos en todos los lavabos de la UCIN.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Prohibir el desecho de líquidos en lavabos, retirar insumos de la zona de salpicadura e intervenir sifones colonizados. Los drenajes son reservorio de enterobacterias resistentes.","sustento":"ppt (sin desecho de líquidos en lavabos; intervención de sifones); CDC NICU ICAR Supplement.","plazo":"Inmediato (≤30 días)"},{"clave":"AMB-06","criterio":"Hay plan de manejo de agua sin agua estancada y con mantenimiento de grifos y aireadores.","cumpleSi":"El plan existe y no se observa agua estancada.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Elaborar plan de manejo de agua con mantenimiento y, si hay brote, muestreo dirigido.","sustento":"CDC NICU ICAR Supplement; Propuesta ejecutiva (eje 7).","plazo":"≤90 días"},{"clave":"AMB-07","criterio":"El gel para ultrasonido es estéril y de un solo uso en procedimientos invasivos (p. ej., inserción guiada de catéter); los envases multiuso no se rellenan y están fechados.","cumpleSi":"Se verifica el gel disponible.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Usar gel estéril unidosis en procedimientos invasivos y no rellenar envases.","sustento":"CDC NICU ICAR Supplement (gel de ultrasonido).","plazo":"≤90 días"},{"clave":"AMB-08","criterio":"La ropa y los blancos se guardan cubiertos en área limpia y no se usa ropa donada sin lavado institucional.","cumpleSi":"Se verifica el almacenamiento.","verificar":"Observación directa","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Guardar blancos cubiertos y lavar toda ropa donada en lavandería institucional.","sustento":"CDC NICU ICAR Supplement (blancos).","plazo":"≤90 días"},{"clave":"AMB-09","criterio":"El personal de limpieza está asignado a la UCIN, capacitado y usa lista de verificación.","cumpleSi":"Hay rol de personal asignado y listas llenas de los últimos 7 días.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Asignar personal de limpieza fijo a la UCIN y capacitarlo con evaluación práctica.","sustento":"Cédula CODECIN Limpieza.","plazo":"≤90 días"},{"clave":"AMB-10","criterio":"Los RPBI se manejan conforme a norma (contenedores adecuados, punzocortantes llenos a no más del 80%).","cumpleSi":"Todos los contenedores revisados cumplen.","verificar":"Observación directa","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Reponer contenedores y supervisar su llenado.","sustento":"NOM-087-SEMARNAT-SSA1-2002.","plazo":"≤90 días"}]},{"id":"M11","sheet":"M11_CEyE","nombre":"Reprocesamiento, desinfección de alto nivel y esterilización","objetivo":"Verificar el reprocesamiento seguro del equipo que entra en contacto con el recién nacido.","reactivos":[{"clave":"CEYE-01","criterio":"La esterilización tiene controles físicos, químicos y biológicos con registro (indicador biológico al menos semanal por equipo).","cumpleSi":"Hay bitácoras de los últimos 3 meses sin fallas sin atender.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Completar los controles de esterilización y retirar de uso toda carga con falla.","sustento":"Propuesta ejecutiva (eje 6, crítico); Cédula CODECIN CEyE.","plazo":"Inmediato (≤30 días)"},{"clave":"CEYE-02","criterio":"Los paquetes estériles tienen trazabilidad (lote, fecha y caducidad) hasta el paciente.","cumpleSi":"Los paquetes revisados están rotulados y el registro permite rastrearlos.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Implantar trazabilidad por lote hasta el paciente.","sustento":"Cédula CODECIN CEyE.","plazo":"≤90 días"},{"clave":"CEYE-03","criterio":"El equipo semicrítico (hojas de laringoscopio, piezas de nebulizador, circuitos reutilizables) recibe desinfección de alto nivel con producto registrado, concentración verificada con tiras, tiempo de contacto y enjuague con agua estéril.","cumpleSi":"Se verifican los 4 elementos en la bitácora y en el proceso.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Estandarizar la desinfección de alto nivel con verificación de concentración en cada uso.","sustento":"Propuesta ejecutiva (eje 6); Cédula CODECIN CEyE.","plazo":"Inmediato (≤30 días)"},{"clave":"CEYE-04","criterio":"El material de un solo uso no se reprocesa, salvo protocolo de reúso aprobado por CODECIN y validado.","cumpleSi":"No se encuentra material de un solo uso reprocesado sin protocolo.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Suspender el reúso no validado de material de un solo uso.","sustento":"Cédula CODECIN Reúso.","plazo":"≤90 días"},{"clave":"CEYE-05","criterio":"El material estéril se guarda en área limpia, seca y cerrada, sin cajas de cartón, con rotación por caducidad.","cumpleSi":"Se verifica el almacén de la UCIN.","verificar":"Observación directa","critico":false,"impacto":1,"naPrevisto":false,"recomendacion":"Reorganizar el almacén estéril y retirar cajas de cartón.","sustento":"Cédula CODECIN CEyE.","plazo":"≤90 días"},{"clave":"CEYE-06","criterio":"En el equipo de aspiración, los frascos y tubos se cambian entre pacientes y las sondas son de un solo uso.","cumpleSi":"Se verifica en todas las cunas.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Cambiar frascos y tubos entre pacientes y usar sondas de un solo uso.","sustento":"Propuesta ejecutiva (eje 6).","plazo":"≤90 días"}]},{"id":"M12","sheet":"M12_Capacidad_Personal","nombre":"Capacidad instalada, plantilla y ocupación","objetivo":"Verificar las condiciones estructurales que más se asocian a brotes: sobrecupo, falta de enfermería y cunas juntas.","reactivos":[{"clave":"CAP-01","criterio":"La ocupación no rebasó el 100% de cunas autorizadas en ningún día de los últimos 30 días.","cumpleSi":"El censo diario de 30 días no muestra sobrecupo. Parcial: sobrecupo en ≤3 días.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Definir con Dirección un tope de ocupación y una ruta de referencia cuando se alcance; el sobrecupo es factor de brotes.","sustento":"Propuesta ejecutiva (eje 9, crítico); ppt (sobrecupo).","plazo":"Inmediato (≤30 días)"},{"clave":"CAP-02","criterio":"La razón enfermera:paciente se cumple en los 3 turnos: cuidados intensivos 1:1 a 1:2; intermedios 1:3; básicos 1:4.","cumpleSi":"La plantilla real de los 3 turnos del día de la visita cumple. Parcial: se cumple en 1 o 2 turnos.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Ajustar la plantilla por turno a la acuidad de los pacientes y documentar la brecha ante Dirección.","sustento":"ppt (razón enfermera:paciente intensivo 1:1 a 1:2); Propuesta ejecutiva (eje 9).","plazo":"Inmediato (≤30 días)"},{"clave":"CAP-03","criterio":"El personal de enfermería de la UCIN no se comparte con otros servicios en el mismo turno, y el personal de apoyo eventual está capacitado en PCI de UCIN.","cumpleSi":"El rol de los últimos 7 días no muestra personal compartido.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Asignar personal exclusivo a la UCIN y capacitar al personal de apoyo antes de su primer turno.","sustento":"Propuesta ejecutiva (eje 9); CDC NICU ICAR Supplement.","plazo":"≤90 días"},{"clave":"CAP-04","criterio":"Ningún recién nacido comparte cuna y hay al menos 2.4 m entre cunas o incubadoras en el área de cuidados intensivos.","cumpleSi":"Se mide la distancia en el área de intensivos y no hay cunas compartidas.","verificar":"Observación directa","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Reorganizar el espacio y, si no es posible, reducir la capacidad autorizada. Compartir cuna se asoció a brotes encadenados.","sustento":"AAP/ACOG Guidelines for Perinatal Care; Propuesta ejecutiva (brotes en Sudáfrica por cunas compartidas).","plazo":"Inmediato (≤30 días)"},{"clave":"CAP-05","criterio":"Hay al menos un cubículo de aislamiento con lavabo propio.","cumpleSi":"Se verifica el cubículo.","verificar":"Observación directa","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Habilitar al menos un cubículo de aislamiento con lavabo.","sustento":"NOM-016-SSA3-2012 (infraestructura hospitalaria).","plazo":"≤90 días"},{"clave":"CAP-06","criterio":"Hay médico neonatólogo o pediatra presente en la UCIN las 24 h.","cumpleSi":"El rol médico de los últimos 7 días lo confirma.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Garantizar cobertura médica 24 h en la UCIN.","sustento":"Niveles de cuidado neonatal AAP.","plazo":"≤90 días"}]},{"id":"M13","sheet":"M13_PROA","nombre":"Programa de optimización de antimicrobianos (PROA) y Comité de Optimización de Antimicrobianos (COA)","objetivo":"Verificar el uso adecuado de antimicrobianos conforme al Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA). En UCIN, los PROA reducen el inicio de antibióticos (19 puntos porcentuales) y su duración (20 puntos porcentuales) sin aumentar la mortalidad por sepsis.","reactivos":[{"clave":"PROA-01","criterio":"Hay equipo PROA formal que cubre la UCIN (líder PROA, neonatólogo de enlace, infectólogo o asesor, farmacéutico, microbiólogo y enfermería), con oficio de designación individual y tiempo protegido para el líder PROA.","cumpleSi":"Hay oficios de designación individuales que señalan funciones y tiempo protegido (líder PROA: mínimo 3 h al día en nivel básico) y minutas de reuniones de los últimos 3 meses.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Formalizar el equipo PROA con oficios individuales y tiempo protegido conforme al Lineamiento (básico: 3 h diarias; intermedio: 3 días por semana; avanzado: dedicación exclusiva). En UCIN, el esfuerzo recae sobre todo en neonatología y enfermería.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (equipo PROA y tiempo protegido); Gong et al., J Perinatol 2026.","plazo":"Inmediato (≤30 días)"},{"clave":"PROA-02","criterio":"Hay guía local de tratamiento empírico de sepsis temprana y tardía basada en el antibiograma de la UCIN, actualizada en los últimos 2 años, que evita carbapenémicos y cefalosporinas de 3ª generación como primera línea.","cumpleSi":"La guía existe, está firmada, tiene fecha ≤2 años y el personal entrevistado la conoce.","verificar":"Revisión documental","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Elaborar guía empírica local: sepsis temprana con ampicilina más aminoglucósido; sepsis tardía según epidemiología local, reservando carbapenémicos.","sustento":"Mascarenhas et al., Pediatrics (metaanálisis PROA neonatal); ppt (limitar cefalosporinas de 3ª y carbapenémicos).","plazo":"Inmediato (≤30 días)"},{"clave":"PROA-03","criterio":"Se evalúa el riesgo de sepsis temprana en RN ≥35 semanas con calculadora de sepsis u observación clínica seriada para evitar antibióticos innecesarios.","cumpleSi":"Hay protocolo y se aplica en expedientes revisados. Marque N/A solo si la UCIN no recibe RN ≥35 semanas.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":true,"recomendacion":"Adoptar calculadora de sepsis temprana u observación seriada en RN ≥35 semanas asintomáticos.","sustento":"Mascarenhas et al. (metaanálisis): 19 puntos porcentuales menos de inicio de antibióticos en UCIN.","plazo":"≤60 días"},{"clave":"PROA-04","criterio":"Se hace revaloración (\"tiempo fuera\") a las 36–48 h y se suspende el antibiótico si el hemocultivo es negativo y no hay sepsis clínica.","cumpleSi":"En la hoja Obs_ATB ≥90% de los tratamientos empíricos tiene revaloración documentada. Parcial: 70–89%.","verificar":"Hoja de observación","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Hacer obligatoria la revaloración a las 36–48 h con decisión escrita: suspender, desescalar o continuar con justificación.","sustento":"Estudio PROA en UCIN (Front Public Health 2026: revaloración obligatoria 48–72 h); ppt (suspensión a 36–48 h).","plazo":"Inmediato (≤30 días)"},{"clave":"PROA-05","criterio":"Se cumple la política de documentación de la prescripción: cada indicación de antimicrobiano registra diagnóstico, dosis, vía, fecha de inicio y duración planeada o fecha de término.","cumpleSi":"Existe la política escrita y en la hoja Obs_ATB ≥90% de las indicaciones tiene duración o fecha de término documentada.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Aplicar la política de documentación óptima de la prescripción (intervención obligatoria del Lineamiento en todos los niveles) y usar duraciones estándar por diagnóstico.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (política de documentación); Mascarenhas et al. (reducción de duración 20%).","plazo":"≤60 días"},{"clave":"PROA-06","criterio":"Los antimicrobianos restringidos (carbapenémicos, cefalosporinas de 3ª–4ª, vancomicina, piperacilina-tazobactam, colistina, antifúngicos) requieren preautorización o auditoría prospectiva con retroalimentación en ≤24 h.","cumpleSi":"Hay formato o registro de autorización o auditoría y en la hoja Obs_ATB ≥90% de los restringidos lo tiene.","verificar":"Hoja de observación","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Implantar preautorización o auditoría prospectiva con retroalimentación para restringidos.","sustento":"Propuesta ejecutiva (eje 10, crítico); ppt (auditoría prospectiva de carbapenémicos).","plazo":"Inmediato (≤30 días)"},{"clave":"PROA-07","criterio":"Se desescala con base en cultivo y antibiograma en las 24 h siguientes al resultado.","cumpleSi":"En los tratamientos dirigidos de la hoja Obs_ATB se ajustó en ≤24 h.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":true,"recomendacion":"Revisar diariamente los cultivos con resultado y ajustar al espectro más reducido; preferir monoterapia.","sustento":"Estudio PROA en UCIN (Front Public Health 2026).","plazo":"≤60 días"},{"clave":"PROA-08","criterio":"Se mide cada mes el consumo de antimicrobianos: farmacia reporta DDD por grupo AWaRe (método obligatorio del Lineamiento) y la UCIN reporta días de terapia (DOT) por 1,000 días-paciente (total, carbapenémicos, cefalosporinas de 3ª, vancomicina y antifúngicos); ambos se presentan en el COA y a la UCIN.","cumpleSi":"Hay reportes mensuales de los últimos 12 meses de DDD/AWaRe y de DOT de la UCIN, con evidencia de difusión. Parcial: solo uno de los dos.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Medir cada mes DDD por grupo AWaRe (herramienta nacional del Lineamiento) y DOT de la UCIN; presentarlos junto con las tasas de IAAS. Meta inicial: reducir 30% el DOT de carbapenémicos.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (monitoreo de consumo ATC/DDD y AWaRe); ppt (DOT carbapenémicos ↓≥30%); Propuesta ejecutiva.","plazo":"≤60 días"},{"clave":"PROA-09","criterio":"Hay protocolo de profilaxis con fluconazol en <1,000 g o <28 semanas basado en la incidencia local de candidiasis invasiva, con vigilancia de especies y CMI.","cumpleSi":"El protocolo existe, está aprobado por CODECIN o PROA y define en qué casos aplica.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Definir profilaxis antifúngica según la incidencia local (recomendada cuando es alta en <1,000 g) y vigilar el cambio de especies.","sustento":"ppt (profilaxis dirigida de Candida en <1,000 g o <28 semanas).","plazo":"≤90 días"},{"clave":"PROA-10","criterio":"No se indican antibióticos profilácticos sin evidencia (por catéter, ventilación, intubación o en RN asintomático sin factores de riesgo).","cumpleSi":"En la hoja Obs_ATB no hay profilaxis sin indicación aceptada.","verificar":"Hoja de observación","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Suspender profilaxis sin evidencia y documentar las indicaciones aceptadas en la guía local.","sustento":"CDC NICU CLABSI Guideline 2022 (recomendación 3).","plazo":"≤90 días"},{"clave":"PROA-11","criterio":"Las dosis se ajustan a edad gestacional y posnatal, y hay niveles séricos de aminoglucósidos y vancomicina.","cumpleSi":"La guía tiene tabla de dosis y el laboratorio procesa niveles.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir tabla de dosis neonatal en la guía y gestionar niveles séricos.","sustento":"Buenas prácticas de farmacia clínica neonatal.","plazo":"≤90 días"},{"clave":"PROA-12","criterio":"El hospital tiene Comité de Optimización de Antimicrobianos (COA) instalado con acta constitutiva, que sesiona al menos una vez al mes con quórum (Presidente, Secretario Técnico, líder PROA y al menos 2 integrantes de UVEH o del comité de IAAS) y trata los datos de la UCIN.","cumpleSi":"Hay acta constitutiva vigente y minutas de los últimos 3 meses con quórum, acuerdos con responsable y fecha, y datos de la UCIN (consumo, multirresistentes, apego a higiene de manos y paquetes).","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Instalar o reinstalar el COA con acta constitutiva en hoja membretada, calendario anual de sesiones mensuales y punto fijo de UCIN en el orden del día.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (instalación y funcionamiento del COA).","plazo":"≤60 días"},{"clave":"PROA-13","criterio":"En los últimos 12 meses se aplicó la autoevaluación de madurez del PROA (herramienta del Anexo 4 del Lineamiento) y, si el resultado fue inadecuado (≤25 puntos), hay plan para llegar a nivel básico en ≤6 meses.","cumpleSi":"La autoevaluación está en la carpeta gerencial con fecha ≤12 meses y su puntaje se capturó en DATOS_VISITA.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Aplicar la autoevaluación anual de madurez PROA con el COA y el equipo PROA; con resultado inadecuado, implantar acciones correctivas inmediatas para llegar a básico en ≤6 meses.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (autoevaluación obligatoria anual; niveles inadecuado, básico, intermedio y avanzado).","plazo":"≤60 días"},{"clave":"PROA-14","criterio":"Se aplican las intervenciones mínimas obligatorias del nivel de madurez del PROA (básico: guía o algoritmo, educación formal, política de documentación y auditoría retrospectiva con retroalimentación; intermedio: además otra retroalimentación y una restrictiva; avanzado: auditoría prospectiva y 3 retroalimentaciones) y están en el Plan Anual de Trabajo aprobado por el COA.","cumpleSi":"El Plan Anual de Trabajo vigente incluye las intervenciones del nivel, con responsable, plazo e indicador, y hay evidencia de su aplicación en la UCIN.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Integrar al Plan Anual de Trabajo las intervenciones mínimas de su nivel de madurez y darles seguimiento mensual en el COA.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (Tabla 5: intervenciones mínimas obligatorias por nivel).","plazo":"≤60 días"},{"clave":"PROA-15","criterio":"Hay criterio escrito para convocar sesión extraordinaria del COA ante brote o aumento no esperado de multirresistentes en la UCIN, o aumento >3% del consumo habitual de antimicrobianos del grupo Reserva.","cumpleSi":"El criterio está en el acta o reglamento del COA; si ocurrió alguno de esos eventos en 12 meses, hay minuta de la sesión extraordinaria.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir en el reglamento del COA los disparadores de sesión extraordinaria y vigilar el consumo de colistina, linezolid, ceftazidima/avibactam, ceftolozano/tazobactam y tigeciclina.","sustento":"Lineamiento estandarizado para la implementación, desarrollo y sostenibilidad del Programa de Optimización del Uso de Antimicrobianos (PROA) y del Comité de Optimización de Antibióticos (COA) (2026) (sesiones extraordinarias).","plazo":"≤90 días"}]},{"id":"M14","sheet":"M14_Diagnostico","nombre":"Diagnóstico microbiológico y stewardship diagnóstico","objetivo":"Verificar que los estudios se pidan y tomen bien, para que el diagnóstico guíe el uso de antimicrobianos.","reactivos":[{"clave":"DIAG-01","criterio":"Se toma hemocultivo antes de iniciar antimicrobiano, con volumen ≥1 mL.","cumpleSi":"En la hoja Obs_ATB ≥90% de los tratamientos tuvo hemocultivo previo con ≥1 mL. Parcial: 70–89%.","verificar":"Hoja de observación","critico":true,"impacto":3,"naPrevisto":false,"recomendacion":"Tomar al menos 1 mL por frasco; con menor volumen no se detecta la bacteriemia y se prolongan antibióticos sin necesidad.","sustento":"Lineamiento estandarizado de intervenciones de Laboratorio de Microbiología Clínica para los Programas de Optimización de Antimicrobianos (2026) (Tabla 15: volumen de hemocultivo en pacientes pediátricos; <1 kg, 2 mL por set de dos botellas pediátricas); ppt (hemocultivo ≥1 mL).","plazo":"Inmediato (≤30 días)"},{"clave":"DIAG-02","criterio":"Los hemocultivos se toman por punción periférica con técnica aséptica y la tasa de contaminación es <3%.","cumpleSi":"La tasa de contaminación de los últimos 3 meses es <3% (hoja INDICADORES).","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Capacitar y usar kit de toma de hemocultivo; medir la contaminación cada mes.","sustento":"Stewardship diagnóstico.","plazo":"≤60 días"},{"clave":"DIAG-03","criterio":"Hay criterios escritos para pedir cultivos y no se piden cultivos de vigilancia sin indicación (punta de catéter, aspirado endotraqueal, piel); el aspirado endotraqueal solo con criterios de NAV.","cumpleSi":"Los criterios existen y en 5 expedientes no hay cultivos sin indicación.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Emitir criterios de solicitud de cultivos y retirar los cultivos de rutina sin indicación.","sustento":"Stewardship diagnóstico; Johnson et al. 2021.","plazo":"≤90 días"},{"clave":"DIAG-04","criterio":"El urocultivo se toma solo por punción suprapúbica o cateterismo (nunca con bolsa) y no se pide en la evaluación de sepsis temprana (<72 h).","cumpleSi":"No hay urocultivos por bolsa en los últimos 3 meses.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Prohibir el urocultivo por bolsa colectora y retirarlo de la evaluación de sepsis temprana.","sustento":"Stewardship diagnóstico.","plazo":"≤90 días"},{"clave":"DIAG-05","criterio":"La PCR, la procalcitonina o la biometría no se usan aisladas para iniciar o prolongar antibióticos cuando el cultivo es negativo.","cumpleSi":"La guía lo indica y en la hoja Obs_ATB no hay continuación justificada solo por biomarcador.","verificar":"Hoja de observación","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Escribir en la guía que los biomarcadores no justifican por sí solos continuar antibióticos con hemocultivo negativo.","sustento":"Mascarenhas et al. (metaanálisis PROA neonatal).","plazo":"≤60 días"},{"clave":"DIAG-06","criterio":"El laboratorio identifica a nivel de especie (incluidas levaduras y Candida auris) y hace antibiograma y antifungigrama con puntos de corte CLSI vigentes.","cumpleSi":"Se verifica capacidad instalada y reportes recientes.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Asegurar identificación a especie y susceptibilidad; referir a laboratorio estatal si no hay capacidad.","sustento":"Lineamiento estandarizado de intervenciones de Laboratorio de Microbiología Clínica para los Programas de Optimización de Antimicrobianos (2026) (fortalecimiento del laborato
