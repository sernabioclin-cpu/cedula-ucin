      '<tr><td>Ventilación</td><td class="c">' + s.VM.auditados + ' pacientes</td><td class="c b">Paquete ' + pct(s.VM.apego) + '</td><td></td></tr>' +
      '<tr><td>Superficies</td><td class="c">' + s.AMB.evaluadas + ' superficies</td><td class="c b">' + pct(s.AMB.pct) + ' conformes</td><td></td></tr>' +
      '<tr><td>Antimicrobianos</td><td class="c">' + s.ATB.pacientes + ' pacientes</td><td class="c b">' + pct(s.ATB.adecuada) + ' adecuada</td><td>Revaloración ' + s.ATB.revalSi + '/' + s.ATB.revalEval + ' · hemocultivo ≥1 mL ' + s.ATB.hcSi + '/' + s.ATB.hcEval + '</td></tr>' +
      '<tr><td>Censo del día</td><td class="c">' + s.CENSO.total + ' pacientes</td><td class="c">CVC ' + s.CENSO.cvc + ' · VM ' + s.CENSO.vm + ' · ATB ' + s.CENSO.atb + '</td><td>Leche humana ' + s.CENSO.lh + '/' + s.CENSO.alimentados + ' · calostro ≤24 h ' + s.CENSO.calostro24 + '/' + s.CENSO.elegCalostro + ' · piel a piel ' + fmt(s.CENSO.horasProm) + ' h</td></tr></tbody></table>';

    h += '<h2>6. Plan de acciones correctivas</h2>';
    if (r.plan.length) h += '<table class="rt plan-t"><thead><tr><th>#</th><th>Prioridad</th><th>Clave</th><th>Hallazgo</th><th>Recomendación</th><th>Plazo</th><th>Responsable</th><th>Fecha compromiso</th><th>Estatus</th></tr></thead><tbody>' + r.plan.map(p => '<tr><td class="c">' + p.n + '</td><td>' + esc(p.prioridad) + '</td><td class="b">' + esc(p.clave) + '</td><td>' + esc(p.hallazgo) + ' <i>(' + esc(p.resultado) + ')</i></td><td>' + esc(p.recomendacion) + '</td><td class="c">' + esc(p.plazo) + '</td><td>' + esc(p.seg.resp || '') + '</td><td class="c">' + (p.seg.fecha ? fechaLarga(p.seg.fecha) : '') + '</td><td>' + esc(p.seg.estatus || '') + '</td></tr>').join('') + '</tbody></table>';
    else h += '<p class="rep-note">No se generaron acciones correctivas.</p>';

    h += '<section class="firmas-b"><h2>7. Brigada y firmas</h2><div class="firmas">';
    r.brigada.forEach(b => { h += '<div class="firma"><div class="fl"></div><b>' + esc(b.nombre) + '</b><span>' + esc([b.perfil, b.inst].filter(Boolean).join(' · ')) + '</span></div>'; });
    [['director', 'Director(a) del hospital'], ['jefeUcin', 'Jefe(a) de la UCIN'], ['uveh', 'Responsable de UVEH / PCI']].forEach(([k, l]) => { h += '<div class="firma"><div class="fl"></div><b>' + esc(d[k] || ' ') + '</b><span>' + l + '</span></div>'; });
    h += '</div></section>';

    if (anexo) {
      h += '<h2 class="salto">Anexo A. Respuestas por módulo</h2>';
      r.mods.forEach(m => {
        h += '<h3>' + m.id + ' · ' + esc(m.nombre) + ' — ' + pct(m.pct) + ' · ' + esc(m.sem) + '</h3><table class="rt"><thead><tr><th style="width:8%">Clave</th><th style="width:46%">Criterio</th><th style="width:11%">Respuesta</th><th>Observaciones</th></tr></thead><tbody>' +
          m.items.map(i => '<tr><td class="b">' + i.r.clave + (i.r.critico ? ' ★' : '') + '</td><td>' + esc(i.r.criterio) + '</td><td class="c cel-' + ({ 'Cumple': 'v', 'Parcial': 'a', 'No cumple': 'r' }[i.resp] || 'g') + '">' + esc(i.resp || '—') + '</td><td>' + esc(i.obs) + '</td></tr>').join('') + '</tbody></table>';
      });
      h += '<h2 class="salto">Anexo B. Registros de observación directa</h2>';
      OBS_TIPOS.forEach(t => { if (r.obs[t].length) h += '<h3>' + esc(DEFS[t].nombre) + '</h3>' + tablaObs(t, r, false).replace('class="tbl obs-t"', 'class="rt obs-t"'); });
    }
    h += '<footer class="rep-f">Informe de visita · Prevención de IAAS y RAM en UCIN · CLUES TSIMB001260 · Generado ' + hora(Date.now()) + '</footer></article>';
    return h;
  }

  // ---------------- exportar a la cédula en Excel ----------------
  async function exportarExcel() {
    const r = calc(S.v), d = r.entrada.datos;
    toast('Generando la cédula en Excel…');
    try {
      const res = await window.ExportarCedula(DATA, r, window.CEDULA_PLANTILLA);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(res.blob);
      a.download = 'Cedula_UCIN_IAAS_RAM_' + (esCap(S.v) ? 'CAPACITACION_' : '') + (d.fecha || hoy()) + '.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      if (res.avisos.length) alert('La cédula se descargó. Avisos:\n\n• ' + res.avisos.join('\n• '));
      else toast('Cédula descargada');
    } catch (e) {
      console.error(e); alert('No se pudo generar el archivo de Excel: ' + (e.message || e));
    }
  }

  // ---------------- acciones ----------------
  const ACC = {
    guardarNombre() { const v = (document.getElementById('nomEval') || {}).value; if (v && v.trim()) { CFG.evaluador = v.trim(); saveCFG(); render(); } },
    guardarClave() { const v = (document.getElementById('claveBrig') || {}).value; if (v && v.trim()) { CFG.token = v.trim(); saveCFG(); ultimoError = ''; DB.rev = 0; programarSync(100); render(); toast('Clave guardada'); } },
    soy(el) { CFG.evaluador = el.dataset.n; saveCFG(); render(); },
    nuevaVisita() {
      if (!CFG.evaluador) { alert('Primero escriba su nombre.'); return; }
      const id = 'V' + hoy().replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      put(id, 'visita', 'meta', { creado: Date.now(), estado: 'abierta' }, 'abierta');
      const reales = visitas().filter(v => v.id !== id && !v.cap);
      const datos = Object.assign({}, DEF_DATOS, { fecha: hoy(), tipo: reales.length ? 'Seguimiento a 90 días' : 'Inicial' });
      const prev = reales[0];
      if (prev) { const pd = entradaDe(prev.id).datos; ['nivel', 'cunas', 'jefeUcin', 'uveh', 'instCoord'].forEach(k => { if (pd[k]) datos[k] = pd[k]; }); }
      Object.entries(datos).forEach(([k, v]) => put(id, 'dato', k, { v }, v));
      ir({ p: 'datos', v: id });
    },
    nuevaCap() {
      if (!CFG.evaluador) { alert('Primero escriba su nombre.'); return; }
      const id = 'CAP-' + hoy().replace(/-/g, '') + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
      put(id, 'visita', 'meta', { creado: Date.now(), estado: 'abierta', cap: 1 }, 'capacitación');
      const datos = Object.assign({}, DEF_DATOS, { fecha: hoy(), tipo: 'Capacitación en uso de la App' });
      Object.entries(datos).forEach(([k, v]) => put(id, 'dato', k, { v }, v));
      put(id, 'brig', uid(), { nombre: CFG.evaluador, inst: 'IMSS-Bienestar', perfil: 'En capacitación', n: Date.now() }, CFG.evaluador);
      ir({ p: 'panel', v: id });
    },
    ejemplo() {
      if (!esCap(S.v)) return;
      const v = S.v, pick = (a, w) => { let t = Math.random() * w.reduce((x, y) => x + y, 0); for (let i = 0; i < a.length; i++) { t -= w[i]; if (t <= 0) return a[i]; } return a[0]; };
      [['nivel', L.nivel[2]], ['cunas', '24'], ['censo', '18'], ['brote', 'No'], ['jefeUcin', 'Jefe(a) de UCIN (ejemplo)'], ['uveh', 'Responsable UVEH (ejemplo)'], ['instCoord', 'Secretaría de Salud estatal'], ['periodoInd', 'Trimestre de ejemplo']].forEach(([k, x]) => put(v, 'dato', k, { v: x }, x));
      put(v, 'brig', uid(), { nombre: 'Evaluador(a) de ejemplo', inst: 'Secretaría de Salud estatal', perfil: 'Infectología', n: Date.now() + 1 }, '');
      DATA.modulos.forEach(m => m.reactivos.forEach(r => { const x = pick(['Cumple', 'Parcial', 'No cumple', 'No aplica'], [7, 2, 1.2, r.naPrevisto ? 1.5 : 0.2]); put(v, 'resp', r.clave, { r: x, obs: '' }, x); }));
      const ob = (d) => put(v, 'obs', uid(), Object.assign({ n: Date.now() + Math.random() }, d), d.f);
      for (let i = 0; i < 32; i++) ob({ f: 'HM', fecha: hoy(), turno: i < 16 ? 'Matutino' : 'Vespertino', cat: pick(L.categoria.slice(0, 4), [5, 2, 2, 1]), mom: pick(L.momento, [3, 2, 1, 3, 2]), acc: pick(L.accion, [7, 1, 2]), guantes: pick(['No', 'Sí'], [9, 1]) });
      for (let i = 1; i <= 4; i++) ob({ f: 'CVC', cuna: 'C-' + i, tipo: pick(L.cateter, [1, 1, 1, 1]), nec: 'Sí', apo: pick(['Sí', 'No'], [4, 1]), des: 'Sí', equ: 'Sí', hm: pick(['Sí', 'No'], [5, 1]) });
      for (let i = 1; i <= 2; i++) ob({ f: 'VM', cuna: 'V-' + i, dias: 3 + i, ext: 'Sí', cab: 'Sí', asp: 'Sí', oral: pick(['Sí', 'No'], [2, 1]), circ: 'Sí', hm: 'Sí' });
      for (let i = 0; i < 20; i++) ob({ f: 'AMB', sup: L.superficie[i % L.superficie.length], ubic: 'Cuna ' + (i + 1), met: L.metodo[0], res: pick(L.conforme, [5, 1]) });
      for (let i = 1; i <= 3; i++) ob({ f: 'ATB', cuna: 'A-' + i, eg: 30 + i, peso: 1400 + 200 * i, atb: 'Ampicilina + amikacina', ind: L.indic[0], dias: i + 1, restr: 'No', dx: 'Sí', hc: pick(['Sí', 'No'], [3, 1]), reval: 'Sí', cont: 'No', dur: 'Sí', guia: 'Sí', preaut: 'N/A' });
      for (let i = 1; i <= 12; i++) ob({ f: 'CENSO', cuna: 'N-' + i, eg: 28 + (i % 10), peso: 900 + 150 * i, dv: i * 2, cvc: i <= 4 ? 'Sí' : 'No', vm: i <= 2 ? 'Sí' : 'No', cpap: i % 3 ? 'No' : 'Sí', atb: i <= 3 ? 'Sí' : 'No', ibp: L.ibp[0], alim: pick(L.alim, [3, 2, 1, 1]), cal: pick(L.calostro, [3, 1, 1, 1]), cang: i % 2 ? 'Sí' : 'No', horas: i % 2 ? 4 + (i % 5) : '', padres: pick(['Sí', 'No'], [4, 1]) });
      DATA.indicadores.filter(d => !d.auto).forEach((d, i) => { if (i % 3 === 2) return; const n = Math.round(Math.random() * 8), den = d.soloNumerador ? '' : 300 + Math.round(Math.random() * 700); put(v, 'ind', d.codigo, { num: n, den, basal: d.regla === 'INFO' ? '' : Math.round((1 + Math.random() * 8) * 10) / 10 }, ''); });
      toast('Visita de práctica llenada con datos de ejemplo'); render();
    },
    borrarVisita() {
      const propios = Object.entries(DB.recs).filter(([k, r]) => r.v === S.v);
      const enServidor = propios.some(([k, r]) => r.rev);
      if (!enServidor) {
        if (!confirm('¿Eliminar esta visita? Nunca se envió al servidor, así que se borra por completo de este dispositivo y no llegará a la hoja de Google.')) return;
        propios.forEach(([k]) => { delete DB.recs[k]; delete OUTBOX[k]; });
        saveDB(); delete cache[S.v]; ir({ p: 'inicio' }); return;
      }
      if (!confirm('¿Eliminar esta visita? Desaparecerá de la lista para toda la brigada. En la hoja de Google queda marcada como eliminada hasta que el responsable la depure (menú Cédula UCIN).')) return;
      Object.keys(OUTBOX).forEach(k => { if (OUTBOX[k].v === S.v) delete OUTBOX[k]; });
      put(S.v, 'visita', 'meta', { estado: 'eliminada' }, 'eliminada', true); ir({ p: 'inicio' });
    },
    borrarLocal() {
      const p = Object.keys(OUTBOX).length;
      if (!confirm('¿Borrar TODO lo guardado en este dispositivo?' + (p ? '\n\nHay ' + p + ' cambio(s) que todavía NO se envían a la hoja de Google; se perderán.' : '') + '\n\nLo que ya está en la hoja de Google no se toca: se vuelve a descargar al sincronizar.')) return;
      DB = { recs: {}, rev: 0 }; OUTBOX = {}; saveDB();
      Object.keys(cache).forEach(k => delete cache[k]);
      try { Object.keys(localStorage).filter(k => k.startsWith('cedula.borr.')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      toast('Datos del dispositivo borrados'); programarSync(300); ir({ p: 'inicio' }); render();
    },
    filtro(el) { LS.set('cedula.filtro', el.dataset.f); render(true); },
    asig(el) { put(S.v, 'asig', el.dataset.m, { quien: el.dataset.q === 'yo' ? CFG.evaluador : '' }, el.dataset.q === 'yo' ? CFG.evaluador : ''); render(true); },
    resp(el) {
      if (!CFG.evaluador) { alert('Escriba primero su nombre (arriba).'); return; }
      const k = el.dataset.k, cur = rec(S.v, 'resp', k);
      const nuevo = cur && cur.d.r === el.dataset.r ? '' : el.dataset.r;
      put(S.v, 'resp', k, { r: nuevo, obs: cur ? cur.d.obs || '' : '' }, nuevo);
      actualizarTarjeta(k);
    },
    brigAdd() { const n = recs(S.v, 'brig').length; put(S.v, 'brig', uid(), { nombre: '', inst: '', perfil: '', n: Date.now() }); render(true); },
    brigDel(el) { const r0 = rec(S.v, 'brig', el.dataset.id); put(S.v, 'brig', el.dataset.id, r0 ? r0.d : {}, '', true); render(true); },
    obsGuardar() {
      const t = S.t || 'HM', def = DEFS[t];
      if (!editObs) editObs = { t, id: null, d: {} };
      const d = Object.assign({}, editObs.d);
      const falta = def.campos.filter(c => c.req && !d[c.k]).map(c => c.l);
      if (falta.length) { alert('Falta: ' + falta.join(', ')); return; }
      if (!CFG.evaluador) { alert('Escriba primero su nombre.'); return; }
      const id = editObs && editObs.id ? editObs.id : uid();
      const prevRec = rec(S.v, 'obs', id);
      const datos = { f: t, n: prevRec ? prevRec.d.n : Date.now() };
      def.campos.forEach(c => { if (d[c.k] !== undefined && d[c.k] !== '') datos[c.k] = c.tipo === 'number' ? Number(d[c.k]) : d[c.k]; });
      put(S.v, 'obs', id, datos, t);
      const keep = {};
      if (!editObs.id) (def.conservar || []).forEach(k => { if (d[k]) keep[k] = d[k]; });
      LS.set('cedula.borr.' + S.v + '.' + t, keep);
      editObs = null; render(true);
      toast('Registro guardado');
    },
    obsCancelar() { LS.set('cedula.borr.' + S.v + '.' + (S.t || 'HM'), {}); editObs = null; render(true); },
    obsEdit(el) { const r0 = rec(S.v, 'obs', el.dataset.id); if (!r0) return; const d = Object.assign({}, r0.d); editObs = { t: r0.d.f, id: el.dataset.id, d }; render(); const f = document.querySelector('.form-obs'); if (f) f.scrollIntoView({ behavior: 'smooth' }); },
    obsDel(el) { if (!confirm('¿Borrar este registro?')) return; const r0 = rec(S.v, 'obs', el.dataset.id); put(S.v, 'obs', el.dataset.id, r0 ? r0.d : {}, '', true); render(true); },
    pend(el) { LS.set('cedula.pend', el.checked); render(); },
    anexo(el) { LS.set('cedula.anexo', el.checked); render(true); },
    imprimir() { window.print(); },
    excel() { exportarExcel(); },
    async probar() {
      document.querySelectorAll('[data-cfg]').forEach(i => { CFG[i.dataset.cfg] = i.value.trim(); }); saveCFG();
      const out = document.getElementById('prueba');
      if (!CFG.url) { out.textContent = 'Guardado. Sin URL: los datos quedan solo en este dispositivo.'; return; }
      out.textContent = 'Probando…';
      try {
        const r = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', token: CFG.token, since: 0, records: [] }) });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error);
        out.textContent = '✓ Conectado. Registros en el servidor: ' + j.records.length;
        DB.rev = 0; programarSync(100);
      } catch (e) { out.textContent = '✗ ' + (e.message || e); }
    },
    respaldo() {
      const blob = new Blob([JSON.stringify({ app: 'cedula-ucin', fecha: new Date().toISOString(), recs: DB.recs }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'respaldo_cedula_ucin_' + hoy() + '.json'; a.click();
    }
  };

  function actualizarTarjeta(k) {
    const r = calc(S.v);
    const m = r.mods.find(x => x.items.some(i => i.r.clave === k));
    const i = m.items.find(x => x.r.clave === k);
    const el = document.getElementById('rc-' + k);
    if (el) el.outerHTML = tarjetaReactivo(i);
    const hd = document.getElementById('modh');
    if (hd) hd.outerHTML = cabModulo(m, r);
    const top = document.querySelector('.top .t2');
    if (top) top.innerHTML = esc(r.entrada.datos.tipo || '') + ' · ' + chip(r.tot.sem);
  }

  let toastT;
  function toast(t) { let el = document.getElementById('toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); } el.textContent = t; el.className = 'show'; clearTimeout(toastT); toastT = setTimeout(() => el.className = '', 1600); }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]');
    if (!el) return;
    const a = el.dataset.a;
    if (a === 'dato' && el.dataset.val !== undefined) { const cur = rec(S.v, 'dato', el.dataset.k); const v = cur && cur.d.v === el.dataset.val ? '' : el.dataset.val; put(S.v, 'dato', el.dataset.k, { v }, v); render(true); return; }
    if (a === 'obsf' && el.dataset.val !== undefined) { if (!editObs) editObs = { t: S.t || 'HM', id: null, d: {} }; editObs.d[el.dataset.k] = editObs.d[el.dataset.k] === el.dataset.val ? '' : el.dataset.val; if (!editObs.id) LS.set('cedula.borr.' + S.v + '.' + editObs.t, editObs.d); el.parentNode.querySelectorAll('.chipb').forEach(b => b.classList.toggle('on', b.dataset.val === editObs.d[el.dataset.k])); return; }
    if (ACC[a] && el.tagName !== 'INPUT' && el.tagName !== 'SELECT') { e.preventDefault(); ACC[a](el); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'importar') { importar(el.files[0]); return; }
    if (el.dataset.cfg) { CFG[el.dataset.cfg] = el.value.trim(); saveCFG(); if (el.dataset.cfg === 'url') { DB.rev = 0; programarSync(300); } return; }
    const a = el.dataset.a;
    if (a === 'pend' || a === 'anexo') { ACC[a](el); return; }
    if (a === 'dato') { put(S.v, 'dato', el.dataset.k, { v: el.value }, el.value); render(true); return; }
    if (a === 'obsf') { if (!editObs) editObs = { t: S.t || 'HM', id: null, d: {} }; editObs.d[el.dataset.k] = el.value; if (!editObs.id) LS.set('cedula.borr.' + S.v + '.' + editObs.t, editObs.d); return; }
    if (a === 'brig') { const r0 = rec(S.v, 'brig', el.dataset.id); const d = Object.assign({}, r0 ? r0.d : {}); d[el.dataset.k] = el.value; put(S.v, 'brig', el.dataset.id, d, d.nombre || ''); render(true); return; }
    if (a === 'ind') { const r0 = rec(S.v, 'ind', el.dataset.c); const d = Object.assign({}, r0 ? r0.d : {}); d[el.dataset.k] = el.value === '' ? '' : Number(el.value); put(S.v, 'ind', el.dataset.c, d, ''); render(true); return; }
    if (a === 'plan') { const r0 = rec(S.v, 'plan', el.dataset.c); const d = Object.assign({}, r0 ? r0.d : {}); d[el.dataset.k] = el.value; put(S.v, 'plan', el.dataset.c, d, d.estatus || ''); return; }
  });
  const obsTimers = {};
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.classList.contains('obs') && el.dataset.k) {
      const k = el.dataset.k; clearTimeout(obsTimers[k]);
      obsTimers[k] = setTimeout(() => { const cur = rec(S.v, 'resp', k); put(S.v, 'resp', k, { r: cur ? cur.d.r || '' : '', obs: el.value }, cur ? cur.d.r || '' : ''); }, 700);
    } else if (el.dataset.a === 'obsf') { if (!editObs) editObs = { t: S.t || 'HM', id: null, d: {} }; editObs.d[el.dataset.k] = el.value; if (!editObs.id) LS.set('cedula.borr.' + S.v + '.' + editObs.t, editObs.d); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nomEval') ACC.guardarNombre(); if (e.key === 'Enter' && e.target.id === 'claveBrig') ACC.guardarClave(); });

  function importar(f) {
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result); let n = 0;
        Object.values(j.recs || {}).forEach(r => { const k = keyOf(r); if (!DB.recs[k] || DB.recs[k].ts < r.ts) { DB.recs[k] = r; OUTBOX[k] = r; n++; } });
        saveDB(); alert('Se importaron ' + n + ' registros.'); programarSync(300); render();
      } catch (e) { alert('El archivo no es un respaldo válido.'); }
    };
    rd.readAsText(f);
  }

  // ---------------- arranque ----------------
  leerHash(); render(); programarSync(400);
  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
