rio de microbiología clínica para su articulación al PROA); Propuesta ejecutiva (eje 11); ppt (Candida a nivel de especie; descartar C. auris).","plazo":"≤60 días"},{"clave":"DIAG-07","criterio":"Se detectan carbapenemasas por fenotipo o genotipo (KPC, NDM, OXA-48, VIM/IMP) y se refieren cepas al LESP/InDRE cuando corresponde.","cumpleSi":"Hay reportes con tipo de carbapenemasa o evidencia de referencia.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Implementar detección de carbapenemasas o convenio de referencia; el tratamiento depende del mecanismo.","sustento":"ppt (carbapenemasa: fenotipo y genotipo; secuenciación vía InDRE).","plazo":"≤60 días"},{"clave":"DIAG-08","criterio":"Los resultados críticos se comunican: tinción de Gram positiva en ≤1 h al médico tratante y alerta de multirresistente a UVEH en ≤24 h.","cumpleSi":"Hay bitácora de resultados críticos con hora de aviso.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Establecer aviso inmediato de resultados críticos con registro de hora y receptor.","sustento":"Lineamiento estandarizado de intervenciones de Laboratorio de Microbiología Clínica para los Programas de Optimización de Antimicrobianos (2026) (notificación inmediata de valores críticos y notificación directa al COA y al equipo PROA); Cédula CODECIN Antimicrobianos (alertas tempranas).","plazo":"≤60 días"},{"clave":"DIAG-09","criterio":"Hay antibiograma acumulado específico de la UCIN actualizado en el último año y difundido.","cumpleSi":"El documento existe con fecha ≤12 meses y lo conocen los médicos entrevistados.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Elaborar el antibiograma acumulado anual de la UCIN (acumular 2 años si hay pocos aislamientos) y usarlo en la guía empírica.","sustento":"Lineamiento estandarizado de intervenciones de Laboratorio de Microbiología Clínica para los Programas de Optimización de Antimicrobianos (2026) (reporte anual de datos acumulados de susceptibilidad); ENARAM (línea 2.2.1 b: antibiograma acumulado); Propuesta ejecutiva (eje 11); CLSI M39.","plazo":"≤90 días"},{"clave":"DIAG-10","criterio":"Se conservan las cepas de hemocultivo y de multirresistentes al menos 6 meses para tipificación en brotes.","cumpleSi":"Hay procedimiento y cepario.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Establecer cepario con procedimiento escrito.","sustento":"Propuesta ejecutiva (eje 11).","plazo":"≤90 días"},{"clave":"DIAG-11","criterio":"Se cultiva el 100% de los casos con sospecha de IAAS.","cumpleSi":"Todos los casos sospechosos de los últimos 3 meses tienen cultivo.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Tomar cultivo en todo caso sospechoso de IAAS antes del antimicrobiano.","sustento":"Cédula CODECIN Antimicrobianos.","plazo":"≤90 días"}]},{"id":"M15","sheet":"M15_Capacitacion","nombre":"Capacitación en prevención de IAAS y RAM","objetivo":"Verificar que todo el personal tenga la capacitación y las competencias para prevenir IAAS y resistencia antimicrobiana.","reactivos":[{"clave":"EDU-01","criterio":"Hay programa anual de capacitación en PCI para la UCIN con temas obligatorios: higiene de manos, paquetes CVC y VM, precauciones, multirresistentes, limpieza, leche humana y PROA.","cumpleSi":"El programa existe y cubre los 7 temas.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Elaborar programa anual con los temas obligatorios y calendario.","sustento":"Propuesta ejecutiva (componente 3 OPS); Cédula CODECIN (capacitación).","plazo":"≤90 días"},{"clave":"EDU-02","criterio":"Todo el personal nuevo, rotante, residente, interno, de limpieza y de apoyo recibe inducción en PCI de UCIN antes de atender pacientes.","cumpleSi":"Hay registro de inducción del 100% del personal que ingresó en los últimos 3 meses.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Hacer obligatoria la inducción antes del primer turno, con evaluación.","sustento":"Propuesta ejecutiva (capacitación al ingreso, incluido personal rotante).","plazo":"≤60 días"},{"clave":"EDU-03","criterio":"Al menos 90% del personal de la UCIN se capacitó en prevención de IAAS en los últimos 12 meses, con evaluación.","cumpleSi":"Las listas y evaluaciones muestran ≥90%. Parcial: 70–89%.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Programar sesiones cortas en servicio por turno hasta cubrir al 90% del personal.","sustento":"Propuesta ejecutiva (capacitación anual).","plazo":"≤60 días"},{"clave":"EDU-04","criterio":"Al menos 90% de médicos y residentes se capacitó en uso racional de antimicrobianos y RAM en los últimos 12 meses (incluye guía local y tiempo fuera).","cumpleSi":"Las listas muestran ≥90%. Parcial: 70–89%.","verificar":"Revisión documental","critico":false,"impacto":3,"naPrevisto":false,"recomendacion":"Capacitar en PROA a todos los prescriptores, incluidos residentes de nuevo ingreso.","sustento":"Estrategia Nacional RAM; Cédula CODECIN (capacitación en uso racional).","plazo":"≤60 días"},{"clave":"EDU-05","criterio":"El personal está capacitado en stewardship diagnóstico: toma de hemocultivo (volumen y técnica) y criterios de cultivos.","cumpleSi":"Las listas muestran ≥90% de enfermería y médicos capacitados.","verificar":"Revisión documental","critico":false,"impacto":2,"naPrevisto":false,"recomendacion":"Incluir taller práctico de toma de hemocultivo en la capacitación.","sustento":"Stewardship diagnóstico.","plazo":"≤90 días"},{"clave":"EDU-06","criterio":"Se evalúan las competencias prácticas de mantenimiento del catéter central en enfermería (observación o simulación) con certificación.","cumpleSi":"≥90% de la enfermería de la UCIN está certificada en lo       for (const c of Array.from(fila.children)) {
        const cr = c.getAttribute('r');
        if (cr === ref) return c;
        if (!sig && colNum(partes(cr)[0]) > colNum(col)) sig = c;
      }
      const c = this.doc.createElementNS(this.ns, 'c'); c.setAttribute('r', ref);
      fila.insertBefore(c, sig);
      fila.removeAttribute('spans');
      return c;
    }
    poner(ref, v) {
      const c = this.celda(ref);
      if (c.getElementsByTagName('f').length) return false; // nunca se sobreescribe una fórmula
      while (c.firstChild) c.removeChild(c.firstChild);
      c.removeAttribute('t');
      if (v === undefined || v === null || v === '') return true;
      if (typeof v === 'number' && isFinite(v)) {
        const e = this.doc.createElementNS(this.ns, 'v'); e.textContent = String(v); c.appendChild(e);
      } else {
        c.setAttribute('t', 'inlineStr');
        const is = this.doc.createElementNS(this.ns, 'is'), t = this.doc.createElementNS(this.ns, 't');
        t.setAttribute('xml:space', 'preserve'); t.textContent = String(v); is.appendChild(t); c.appendChild(is);
      }
      return true;
    }
    sinCache() { // quita valores guardados de fórmulas: se recalculan al abrir
      Array.from(this.sd.getElementsByTagName('c')).forEach(c => {
        if (!c.getElementsByTagName('f').length) return;
        Array.from(c.getElementsByTagName('v')).forEach(v => v.parentNode.removeChild(v));
        if (c.getAttribute('t') && c.getAttribute('t') !== 'str') c.removeAttribute('t');
        if (c.getAttribute('t') === 'str') c.removeAttribute('t');
      });
    }
    xml() { return new XMLSerializer().serializeToString(this.doc); }
  }

  async function exportar(DATA, r, plantillaB64) {
    const avisos = [];
    const zip = await JSZip.loadAsync(b64aBytes(plantillaB64));
    const wbXml = await zip.file('xl/workbook.xml').async('string');
    const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    const ruta = {};
    const wbDoc = new DOMParser().parseFromString(wbXml, 'application/xml');
    const relDoc = new DOMParser().parseFromString(rels, 'application/xml');
    const destino = {};
    Array.from(relDoc.getElementsByTagName('Relationship')).forEach(x => { destino[x.getAttribute('Id')] = x.getAttribute('Target'); });
    Array.from(wbDoc.getElementsByTagName('sheet')).forEach(s => {
      const t = destino[s.getAttributeNS(NS_R, 'id') || s.getAttribute('r:id')];
      ruta[s.getAttribute('name')] = 'xl/' + t.replace(/^\/?xl\//, '');
    });
    const hojas = {};
    const H = async nombre => {
      if (!hojas[nombre]) hojas[nombre] = new Hoja(await zip.file(ruta[nombre]).async('string'));
      return hojas[nombre];
    };

    const e = r.entrada, d = e.datos;
    // DATOS_VISITA
    const dv = await H('DATOS_VISITA');
    Object.entries(DATOS_CELDAS).forEach(([k, ref]) => {
      let v = d[k];
      if (FECHAS.has(k)) v = serialFecha(v);
      else if (HORAS.has(k)) v = serialHora(v);
      else if (NUMS.has(k)) v = (v === '' || v === undefined || v === null || isNaN(Number(v))) ? '' : Number(v);
      dv.poner(ref, v === null ? '' : v);
    });
    const brig = r.brigada;
    if (brig.length > 8) avisos.push('La cédula tiene lugar para 8 integrantes de la brigada; se exportaron los primeros 8 de ' + brig.length + '.');
    for (let i = 0; i < 8; i++) {
      const b = brig[i] || {};
      dv.poner('B' + (28 + i), b.nombre || ''); dv.poner('C' + (28 + i), b.inst || ''); dv.poner('D' + (28 + i), b.perfil || '');
    }

    // Módulos: respuesta (H) y observaciones (I)
    for (const m of DATA.modulos) {
      const nombre = Object.keys(ruta).find(n => n.startsWith(m.id + '_'));
      const h = await H(nombre);
      const mod = r.mods.find(x => x.id === m.id);
      m.reactivos.forEach((re, i) => {
        const it = mod.items[i];
        h.poner('H' + (8 + i), it.resp || ''); h.poner('I' + (8 + i), it.obs || '');
      });
    }

    // Observación directa
    for (const [tipo, cfg] of Object.entries(OBS)) {
      const h = await H(cfg.hoja);
      const filas = e.obs[tipo] || [];
      if (filas.length > cfg.max) avisos.push('La hoja ' + cfg.hoja + ' tiene ' + cfg.max + ' renglones; se exportaron ' + cfg.max + ' de ' + filas.length + ' registros (los cálculos de la app sí usan todos).');
      for (let i = 0; i < cfg.max; i++) {
        const x = filas[i] || {};
        Object.entries(cfg.cols).forEach(([col, k]) => {
          let v = x[k];
          if (FECHA_OBS.has(k)) v = serialFecha(v);
          h.poner(col + (cfg.fila + i), v === null || v === undefined ? '' : v);
        });
      }
    }

    // Indicadores: periodo, numerador, denominador y basal (solo celdas de captura)
    const ind = await H('INDICADORES');
    ind.poner('E3', d.periodoInd || '');
    DATA.indicadores.forEach((def, i) => {
      const fila = 6 + i, cap = e.ind[def.codigo] || {};
      const n = v => (v === '' || v === undefined || v === null || isNaN(Number(v))) ? '' : Number(v);
      if (!def.auto) { ind.poner('E' + fila, n(cap.num)); if (!def.soloNumerador) ind.poner('F' + fila, n(cap.den)); }
      if (def.regla !== 'INFO') ind.poner('J' + fila, n(cap.basal));
    });

    // Plan de mejora: seguimiento en el mismo orden que calcula la cédula
    const pm = await H('PLAN_MEJORA');
    for (let i = 0; i < 184; i++) {
      const p = r.plan[i], s = p ? p.seg : {};
      const fila = 7 + i;
      pm.poner('I' + fila, s.resp || ''); pm.poner('J' + fila, serialFecha(s.fecha) || ''); pm.poner('K' + fila, s.estatus || ''); pm.poner('L' + fila, s.evid || '');
    }

    // Escribir hojas y forzar recálculo
    for (const nombre of Object.keys(ruta)) {
      const h = hojas[nombre] || null;
      if (h) { h.sinCache(); zip.file(ruta[nombre], h.xml()); }
      else {
        const otra = new Hoja(await zip.file(ruta[nombre]).async('string'));
        otra.sinCache(); zip.file(ruta[nombre], otra.xml());
      }
    }
    let calc = wbDoc.getElementsByTagName('calcPr')[0];
    if (!calc) { calc = wbDoc.createElementNS(wbDoc.documentElement.namespaceURI, 'calcPr'); wbDoc.documentElement.appendChild(calc); }
    calc.setAttribute('fullCalcOnLoad', '1');
    zip.file('xl/workbook.xml', new XMLSerializer().serializeToString(wbDoc));
    if (zip.file('xl/calcChain.xml')) {
      zip.remove('xl/calcChain.xml');
      let ct = await zip.file('[Content_Types].xml').async('string');
      ct = ct.replace(/<Override[^>]*calcChain[^>]*\/>/, ''); zip.file('[Content_Types].xml', ct);
      let wr = await zip.file('xl/_rels/workbook.xml.rels').async('string');
      wr = wr.replace(/<Relationship[^>]*calcChain[^>]*\/>/, ''); zip.file('xl/_rels/workbook.xml.rels', wr);
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    return { blob, avisos };
  }

  root.ExportarCedula = exportar;
})(this);
</script>

(function (root) {

          { k: 'peso', l: 'Peso actual (g)', tipo: 'number' },

        ]
      },
      CENSO: {
        nombre: 'Censo del día', corto: 'Censo',
        ayuda: 'Un registro por paciente hospitalizado hoy. Calostro: elegible si <32 sem o <1,500 g al nacer, o en ayuno.',
        campos: [
          { k: 'cuna', l: 'Cuna / ID', tipo: 'text', req: true },
          { k: 'eg', l: 'EG al nacer (sem)', tipo: 'number' },
          { k: 'peso', l: 'Peso al nacer (g)', tipo: 'number' },
          { k: 'dv', l: 'Días de vida', tipo: 'number' },
          { k: 'cvc', l: 'Catéter central o umbilical', op: L.sino },
          { k: 'vm', l: 'Ventilación invasiva', op: L.sino },
          { k: 'cpap', l: 'CPAP / VNI', op: L.sino },
          { k: 'atb', l: 'Antimicrobiano hoy', op: L.sino },
          { k: 'ibp', l: 'IBP o anti-H2', op: L.ibp },
          { k: 'alim', l: 'Alimentación actual', op: L.alim },
          { k: 'cal', l: 'Calostro orofaríngeo', op: L.calostro },
          { k: 'cang', l: 'Elegible para canguro hoy', op: L.sino },
          { k: 'horas', l: 'Horas piel a piel en últimas 24 h', tipo: 'number' },
          { k: 'padres', l: 'Madre o padre presente en últimas 24 h', op: L.sino }
        ]
      }
    };
  }

  const blank = v => v === undefined || v === null || v === '';
  const cnt = (rows, k, val) => rows.filter(r => r[k] === val).length;
  const ratio = (a, b) => (b ? a / b : '');

  function diasEntre(fechaVisita, fecha) {
    if (!fechaVisita || !fecha) return '';
    const a = Date.parse(fechaVisita + 'T00:00:00'), b = Date.parse(fecha + 'T00:00:00');
    if (isNaN(a) || isNaN(b)) return '';
    return Math.round((a - b) / 86400000);
  }

  // ---------- estado calculado de cada registro de observación ----------
  function filaObs(tipo, r, fechaVisita) {
    const x = Object.assign({}, r);
    if (tipo === 'CVC') {
      x.diasInst = diasEntre(fechaVisita, r.finst);
      if (blank(r.cuna) || blank(r.tipo)) x.limite = '';
      else if (r.tipo === 'Umbilical arterial') x.limite = x.diasInst === '' ? 'Falta fecha' : (x.diasInst <= 5 ? 'Sí' : 'No');
      else if (r.tipo === 'Umbilical venoso') x.limite = x.diasInst === '' ? 'Falta fecha' : (x.diasInst <= 14 ? 'Sí' : 'No');
      else x.limite = 'N/A';
      const el = ['nec', 'apo', 'des', 'equ', 'hm'];
      if (blank(r.cuna)) x.estado = '';
      else if (el.filter(k => r[k] === 'No').length + (x.limite === 'No' ? 1 : 0) > 0) x.estado = 'No';
      else if (el.some(k => blank(r[k]))) x.estado = 'Incompleto';
      else x.estado = 'Sí';
    } else if (tipo === 'VM') {
      const el = ['ext', 'cab', 'asp', 'oral', 'circ', 'hm'];
      if (blank(r.cuna)) x.estado = '';
      else if (el.some(k => r[k] === 'No')) x.estado = 'No';
      else if (el.some(k => blank(r[k]))) x.estado = 'Incompleto';
      else x.estado = 'Sí';
    } else if (tipo === 'ATB') {
      const el = ['restr', 'dx', 'hc', 'reval', 'cont', 'dur', 'guia', 'preaut'];
      if (blank(r.cuna)) x.estado = '';
      else if (el.some(k => blank(r[k]))) x.estado = 'Incompleto';
      else if (r.dx === 'No' || r.hc === 'No' || r.reval === 'No' || r.cont === 'Sí' || r.dur === 'No' || r.guia === 'No' || r.preaut === 'No') x.estado = 'No';
      else x.estado = 'Sí';
    } else if (tipo === 'HM') {
      x.estado = blank(r.acc) ? '' : (r.acc === 'Omisión' ? 'No' : 'Sí');
    } else if (tipo === 'AMB') {
      x.estado = blank(r.res) ? '' : (r.res === 'Conforme' ? 'Sí' : 'No');
    }
    return x;
  }

  function pctSi(rows, k) {
    const s = cnt(rows, k, 'Sí'), n = cnt(rows, k, 'No');
    return s + n === 0 ? '' : s / (s + n);
  }

  // ---------- estadísticas por hoja (equivalen a las celdas de resumen de cada Obs_) ----------
  function statsObs(obs, L) {
    const S = {};
    const hm = obs.HM;
    const conHig = r => r.acc === 'Fricción con solución alcohólica' || r.acc === 'Lavado con agua y jabón';
    S.HM = {
      oport: hm.filter(r => !blank(r.acc)).length,
      conHigiene: hm.filter(conHig).length,
      guantes: cnt(hm, 'guantes', 'Sí'),
      turnos: ['Matutino', 'Vespertino', 'Nocturno', 'Jornada acumulada / fin de semana'].filter(t => cnt(hm, 'turno', t) > 0).length,
      porCategoria: L.categoria.map(c => { const o = hm.filter(r => r.cat === c && !blank(r.acc)); const h = o.filter(conHig).length; return { c, o: o.length, h, a: ratio(h, o.length) }; }),
      porMomento: L.momento.map(c => { const o = hm.filter(r => r.mom === c && !blank(r.acc)); const h = o.filter(conHig).length; return { c, o: o.length, h, a: ratio(h, o.length) }; })
    };
    S.HM.apego = ratio(S.HM.conHigiene, S.HM.oport);

    const cvc = obs.CVC;
    S.CVC = {
      registros: cvc.length,
      auditados: cnt(cvc, 'estado', 'Sí') + cnt(cvc, 'estado', 'No'),
      completo: cnt(cvc, 'estado', 'Sí'),
      fueraLimite: cnt(cvc, 'limite', 'No'),
      elem: { nec: pctSi(cvc, 'nec'), apo: pctSi(cvc, 'apo'), des: pctSi(cvc, 'des'), equ: pctSi(cvc, 'equ'), hm: pctSi(cvc, 'hm') }
    };
    S.CVC.apego = ratio(S.CVC.completo, S.CVC.auditados);

    const vm = obs.VM;
    S.VM = {
      registros: vm.length,
      auditados: cnt(vm, 'estado', 'Sí') + cnt(vm, 'estado', 'No'),
      completo: cnt(vm, 'estado', 'Sí'),
      elem: { ext: pctSi(vm, 'ext'), cab: pctSi(vm, 'cab'), asp: pctSi(vm, 'asp'), oral: pctSi(vm, 'oral'), circ: pctSi(vm, 'circ'), hm: pctSi(vm, 'hm') }
    };
    S.VM.apego = ratio(S.VM.completo, S.VM.auditados);

    const amb = obs.AMB;
    S.AMB = { evaluadas: amb.filter(r => !blank(r.res)).length, conformes: cnt(amb, 'res', 'Conforme') };
    S.AMB.pct = ratio(S.AMB.conformes, S.AMB.evaluadas);

    const atb = obs.ATB;
    const si = k => cnt(atb, k, 'Sí'), ev = k => cnt(atb, k, 'Sí') + cnt(atb, k, 'No');
    S.ATB = {
      pacientes: atb.filter(r => !blank(r.cuna)).length,
      adecuada: ratio(cnt(atb, 'estado', 'Sí'), cnt(atb, 'estado', 'Sí') + cnt(atb, 'estado', 'No')),
      revalSi: si('reval'), revalEval: ev('reval'),
      contSi: si('cont'), contEval: ev('cont'),
      hcSi: si('hc'), hcEval: ev('hc'),
      durPct: pctSi(atb, 'dur'), preautPct: pctSi(atb, 'preaut')
    };

    const c = obs.CENSO;
    const elegCang = c.filter(r => r.cang === 'Sí');
    S.CENSO = {
      total: c.filter(r => !blank(r.cuna)).length,
      cvc: cnt(c, 'cvc', 'Sí'), vm: cnt(c, 'vm', 'Sí'), atb: cnt(c, 'atb', 'Sí'),
      ibpSin: cnt(c, 'ibp', 'Sí, sin indicación escrita'),
      alimentados: c.filter(r => !blank(r.alim)).length - cnt(c, 'alim', 'Ayuno'),
      lh: cnt(c, 'alim', 'Leche humana exclusiva') + cnt(c, 'alim', 'Mixta (leche humana + fórmula)'),
      elegCalostro: c.filter(r => !blank(r.cal)).length - cnt(c, 'cal', 'No elegible'),
      calostro24: cnt(c, 'cal', 'Iniciado ≤24 h'),
      elegCanguro: elegCang.length,
      horasSum: elegCang.reduce((a, r) => a + (Number(r.horas) || 0), 0),
      padres: cnt(c, 'padres', 'Sí')
    };
    S.CENSO.horasProm = ratio(S.CENSO.horasSum, S.CENSO.elegCanguro);
    return S;
  }

  // ---------- respuesta sugerida desde las hojas Obs_ ----------
  function niveles(v, c, p) { return v === '' ? '' : (v >= c ? 'Cumple' : (p !== undefined && v >= p ? 'Parcial' : 'No cumple')); }
  const pctTxt = v => (v === '' ? '' : Math.round(v * 100) + '%');

  function sugerencias(S) {
    const s = {};
    const add = (clave, resp, txt) => { if (resp) s[clave] = { r: resp, txt: resp + ' (' + txt + ')' }; };
    const hmData = S.HM.oport > 0;
    add('HM-01', niveles(S.HM.apego, 0.9, 0.7), pctTxt(S.HM.apego));
    if (hmData) add('HM-06', S.HM.guantes === 0 ? 'Cumple' : (S.HM.guantes <= 2 ? 'Parcial' : 'No cumple'), S.HM.guantes);
    add('CVC-05', niveles(S.CVC.elem.nec, 1), pctTxt(S.CVC.elem.nec));
    add('CVC-07', niveles(S.CVC.elem.apo, 1, 0.8), pctTxt(S.CVC.elem.apo));
    add('CVC-08', niveles(S.CVC.elem.equ, 1), pctTxt(S.CVC.elem.equ));
    if (S.CVC.registros > 0) add('CVC-10', S.CVC.fueraLimite === 0 ? 'Cumple' : 'No cumple', S.CVC.fueraLimite);
    add('CVC-11', niveles(S.CVC.apego, 0.95, 0.8), pctTxt(S.CVC.apego));
    add('VM-02', niveles(S.VM.elem.ext, 1), pctTxt(S.VM.elem.ext));
    add('VM-03', niveles(S.VM.elem.cab, 1), pctTxt(S.VM.elem.cab));
    add('VM-05', niveles(S.VM.elem.oral, 1), pctTxt(S.VM.elem.oral));
    if (S.CENSO.total > 0) add('MIN-03', S.CENSO.ibpSin === 0 ? 'Cumple' : 'No cumple', S.CENSO.ibpSin);
    add('LH-02', niveles(ratio(S.CENSO.calostro24, S.CENSO.elegCalostro), 0.8, 0.5), pctTxt(ratio(S.CENSO.calostro24, S.CENSO.elegCalostro)));
    add('LH-12', niveles(ratio(S.CENSO.lh, S.CENSO.alimentados), 0.8, 0.6), pctTxt(ratio(S.CENSO.lh, S.CENSO.alimentados)));
    add('FAM-03', niveles(S.CENSO.horasProm, 8, 2), S.CENSO.horasProm === '' ? '' : S.CENSO.horasProm.toFixed(1) + ' h');
    add('AMB-02', niveles(S.AMB.pct, 0.85, 0.7), pctTxt(S.AMB.pct));
    add('PROA-04', niveles(ratio(S.ATB.revalSi, S.ATB.revalEval), 0.9, 0.7), pctTxt(ratio(S.ATB.revalSi, S.ATB.revalEval)));
    add('PROA-05', niveles(S.ATB.durPct, 0.9, 0.7), pctTxt(S.ATB.durPct));
    add('PROA-06', niveles(S.ATB.preautPct, 0.9, 0.7), pctTxt(S.ATB.preautPct));
    add('DIAG-01', niveles(ratio(S.ATB.hcSi, S.ATB.hcEval), 0.9, 0.7), pctTxt(ratio(S.ATB.hcSi, S.ATB.hcEval)));
    if (hmData) add('GI-05', S.HM.turnos >= 2 ? 'Cumple' : 'No cumple', S.HM.turnos);
    return s;
  }

  // ---------- indicadores ----------
  function valorAuto(codigo, S, datos) {
    const m = {
      'IND-08': [S.HM.conHigiene, S.HM.oport], 'IND-09': [S.CVC.completo, S.CVC.auditados],
      'IND-10': [S.VM.completo, S.VM.auditados], 'IND-11': [S.AMB.conformes, S.AMB.evaluadas],
      'IND-13': [datos.censo, datos.cunas], 'IND-14': [S.CENSO.cvc, S.CENSO.total],
      'IND-15': [S.CENSO.vm, S.CENSO.total], 'IND-18': [S.CENSO.atb, S.CENSO.total],
      'IND-19': [S.ATB.revalSi, S.ATB.revalEval], 'IND-20': [S.ATB.contSi, S.ATB.contEval],
      'IND-21': [S.ATB.hcSi, S.ATB.hcEval], 'IND-23': [S.CENSO.calostro24, S.CENSO.elegCalostro],
      'IND-24': [S.CENSO.lh, S.CENSO.alimentados], 'IND-25': [S.CENSO.horasSum, S.CENSO.elegCanguro],
      'IND-26': [S.CENSO.padres, S.CENSO.total], 'IND-35': [datos.proa, '']
    };
    return m[codigo];
  }

  function num(v) { if (blank(v)) return ''; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? '' : n; }

  function calcIndicador(def, cap, S, datos) {
    let n, d, basal = num(cap && cap.basal);
    if (def.auto) {
      const a = valorAuto(def.codigo, S, datos) || ['', ''];
      n = num(a[0]); d = num(a[1]);
      // Las hojas Obs_ devuelven 0 aunque estén vacías; el Excel trata 0/0 como sin dato.
    } else { n = num(cap && cap.num); d = num(cap && cap.den); }
    let g;
    if (def.soloNumerador) g = n;
    else g = (n === '' || d === '' || d === 0) ? '' : n / d * def.factor;
    const k = (g === '' || basal === '' || basal === 0) ? '' : (g - basal) / basal;
    let sem;
    if (def.regla === 'INFO') sem = 'INFORMATIVO';
    else if (g === '') sem = 'SIN DATO';
    else if (def.regla === 'RED') sem = (basal === '' || basal === 0) ? 'CAPTURE BASAL' : (-k >= def.p ? 'VERDE' : (-k >= def.q ? 'AMARILLO' : 'ROJO'));
    else if (def.regla === '<=') sem = g <= def.p ? 'VERDE' : (g <= def.q ? 'AMARILLO' : 'ROJO');
    else sem = g >= def.p ? 'VERDE' : (g >= def.q ? 'AMARILLO' : 'ROJO');
    return { codigo: def.codigo, def, num: n, den: d, basal, res: g, cambio: k, sem, recomendacion: (sem === 'ROJO' || sem === 'AMARILLO') ? def.recomendacion : '' };
  }

  // ---------- módulos ----------
  function calcModulo(m, resp, sug) {
    const items = m.reactivos.map(r => {
      const a = resp[r.clave] || {};
      const R = a.r || '';
      const pts = R === 'Cumple' ? r.impacto : R === 'Parcial' ? r.impacto * 0.5 : R === 'No cumple' ? 0 : '';
      const pos = (R === '' || R === 'No aplica') ? 0 : r.impacto;
      const s = sug[r.clave];
      return {
        r, resp: R, obs: a.obs || '', quien: a.u || '', ts: a.ts || 0, pts, pos,
        alerta: (R === 'No aplica' && !r.naPrevisto) ? 'N/A en reactivo que suele aplicar: anote la razón en Observaciones' : '',
        mejora: R === 'Parcial' || R === 'No cumple',
        sug: s ? s.txt : null, sugResp: s ? s.r : null,
        difiere: !!(s && R && R !== s.r)
      };
    });
    const obt = items.reduce((a, i) => a + (i.pts === '' ? 0 : i.pts), 0);
    const pos = items.reduce((a, i) => a + i.pos, 0);
    const contestados = items.filter(i => i.resp).length;
    const critNo = items.filter(i => i.r.critico && i.resp === 'No cumple').length;
    const critParcial = items.filter(i => i.r.critico && i.resp === 'Parcial').length;
    const pct = pos === 0 ? '' : obt / pos;
    let sem;
    if (contestados === 0) sem = 'SIN EVALUAR';
    else if (critNo > 0) sem = 'ROJO';
    else if (pct === '') sem = 'SIN EVALUAR';
    else if (pct >= 0.85 && critParcial === 0) sem = 'VERDE';
    else if (pct >= 0.7) sem = 'AMARILLO';
    else sem = 'ROJO';
    return { id: m.id, nombre: m.nombre, objetivo: m.objetivo, items, total: items.length, contestados, obt, pos, pct, critNo, critParcial, sem };
  }

  const ETQ = ['', '1 · Crítico no cumplido', '2 · Crítico parcial', '3 · Alto impacto', '4 · Alto impacto (parcial)', '5 · Impacto medio', '6 · Complementario'];

  // ---------- cálculo completo de una visita ----------
  // entrada: { datos:{...}, resp:{clave:{r,obs,u,ts}}, obs:{HM:[...],...}, ind:{IND-01:{num,den,basal}}, plan:{clave:{...}} }
  function calcular(DATA, entrada) {
    const L = DATA.listas;
    const defs = obsDefs(L);
    const datos = Object.assign({}, entrada.datos || {});
    datos.cunas = num(datos.cunas); datos.censo = num(datos.censo); datos.proa = num(datos.proa); datos.ipcaf = num(datos.ipcaf);

    const obs = {};
    Object.keys(defs).forEach(t => { obs[t] = ((entrada.obs || {})[t] || []).map(r => filaObs(t, r, datos.fecha)); });
    const S = statsObs(obs, L);
    const sug = sugerencias(S);

    const mods = DATA.modulos.map(m => calcModulo(m, entrada.resp || {}, sug));
    const m15 = mods.slice(0, 15);
    const tot = {
      reactivos: m15.reduce((a, m) => a + m.total, 0),
      contestados: m15.reduce((a, m) => a + m.contestados, 0),
      obt: m15.reduce((a, m) => a + m.obt, 0),
      pos: m15.reduce((a, m) => a + m.pos, 0),
      critNo: m15.reduce((a, m) => a + m.critNo, 0),
      critParcial: m15.reduce((a, m) => a + m.critParcial, 0)
    };
    tot.pct = tot.pos === 0 ? '' : tot.obt / tot.pos;
    const pcts = m15.map(m => m.pct).filter(p => p !== '');
    const minPct = pcts.length ? Math.min.apply(null, pcts) : 0; // MIN() de Excel ignora vacíos y da 0 si no hay
    if (tot.contestados === 0) tot.sem = 'SIN EVALUAR';
    else if (tot.critNo > 0 || datos.brote === 'Sí') tot.sem = 'ROJO';
    else if (tot.critParcial === 0 && minPct >= 0.85) tot.sem = 'VERDE';
    else tot.sem = 'AMARILLO';

    // clasificación
    const H = tot.pct;
    const C = {};
    C.desempeno = H === '' ? '' : (H < 0.5 ? 'Crítico (<50%)' : H < 0.7 ? 'En desarrollo (50–69%)' : H <= 0.85 ? 'Consolidándose (70–85%)' : 'Consolidado (>85%)');
    C.complejidad = blank(datos.nivel) ? 'Capture nivel en Datos de la visita' : String(datos.nivel).slice(0, 2);
    if (datos.ipcaf !== '') C.pci = datos.ipcaf <= 200 ? 'Inadecuado' : datos.ipcaf <= 400 ? 'Básico' : datos.ipcaf <= 600 ? 'Intermedio' : 'Avanzado';
    else C.pci = H === '' ? '' : (H < 0.25 ? 'Inadecuado' : H < 0.5 ? 'Básico' : H < 0.75 ? 'Intermedio' : 'Avanzado');
    const R = k => ((entrada.resp || {})[k] || {}).r || '';
    if (datos.proa !== '') C.proa = datos.proa <= 25 ? 'P0' : datos.proa <= 50 ? 'P1' : datos.proa <= 75 ? 'P2' : 'P3';
    else if (R('PROA-01') !== 'Cumple' || R('PROA-02') !== 'Cumple' || R('PROA-12') === 'No cumple') C.proa = 'P0';
    else if (R('PROA-04') === 'Cumple' && R('PROA-06') === 'Cumple' && R('PROA-08') === 'Cumple') C.proa = (R('DIAG-09') === 'Cumple' && R('GOB-11') === 'Cumple') ? 'P3' : 'P2';
    else C.proa = 'P1';
    C.riesgo = tot.sem;
    C.codigo = C.riesgo === 'SIN EVALUAR' ? '' : C.complejidad + ' · PCI-' + C.pci + ' · PROA-' + C.proa + ' · ' + C.riesgo;
    const n34 = C.complejidad === 'N3' || C.complejidad === 'N4', n12 = C.complejidad === 'N1' || C.complejidad === 'N2';
    if (C.riesgo === 'SIN EVALUAR') C.prioridad = '';
    else if (C.riesgo === 'ROJO' && n34) C.prioridad = '1 · Inmediata';
    else if ((C.riesgo === 'ROJO' && n12) || (C.riesgo === 'AMARILLO' && n34 && (C.pci === 'Inadecuado' || C.pci === 'Básico' || C.proa === 'P0'))) C.prioridad = '2 · Alta';
    else if (C.riesgo === 'AMARILLO') C.prioridad = '3 · Media';
    else if (C.riesgo === 'VERDE') C.prioridad = '4 · Mantenimiento';
    else C.prioridad = 'Capture nivel de UCIN';
    C.accion = { '1': 'Plan correctivo en 30 días, acompañamiento en sitio, verificación a 30 días y notificación a la Subsecretaría.', '2': 'Plan correctivo en 60 días y verificación a 90 días.', '3': 'Plan correctivo en 90 días y verificación a 6 meses.', '4': 'Revisión anual; candidato a hospital mentor de unidades en prioridad 1 y 2.' }[String(C.prioridad).charAt(0)] || '';

    // indicadores
    const inds = DATA.indicadores.map(d => calcIndicador(d, (entrada.ind || {})[d.codigo], S, datos));
    const cuentaInd = { VERDE: 0, AMARILLO: 0, ROJO: 0, SIN: 0 };
    inds.forEach(i => { if (i.sem === 'VERDE' || i.sem === 'AMARILLO' || i.sem === 'ROJO') cuentaInd[i.sem]++; else if (i.sem === 'SIN DATO' || i.sem === 'CAPTURE BASAL') cuentaInd.SIN++; });

    // plan de acción (mismo orden que _BD / PLAN_MEJORA)
    const plan = [];
    let fila = 0;
    m15.forEach(m => m.items.forEach(i => {
      fila++;
      if (!i.mejora) return;
      const r = i.r, parcial = i.resp === 'Parcial';
      const K = r.critico ? (parcial ? 2 : 1) : (r.impacto === 3 ? (parcial ? 4 : 3) : (r.impacto === 2 ? 5 : 6));
      plan.push({ K, fila, prioridad: ETQ[K], modulo: m.nombre, modId: m.id, clave: r.clave, hallazgo: r.criterio, resultado: i.resp, recomendacion: r.recomendacion, plazo: r.plazo, critico: r.critico });
    }));
    inds.forEach(i => {
      fila++;
      if (i.sem !== 'ROJO' && i.sem !== 'AMARILLO') return;
      const K = i.sem === 'ROJO' ? 3 : 5;
      plan.push({
        K, fila, prioridad: K === 3 ? '3 · Indicador en rojo' : '5 · Indicador en amarillo', modulo: 'Indicadores', modId: 'IND', clave: i.codigo,
        hallazgo: 'Indicador fuera de meta: ' + i.def.nombre, resultado: i.sem + ' (resultado: ' + (i.res === '' ? 's/d' : i.res.toFixed(1)) + ' ' + i.def.unidad + ')',
        recomendacion: i.def.recomendacionPlan || '', plazo: i.sem === 'ROJO' ? '≤60 días' : '≤90 días', critico: false
      });
    });
    plan.sort((a, b) => a.K - b.K || a.fila - b.fila);
    plan.forEach((p, n) => { p.n = n + 1; p.seg = (entrada.plan || {})[p.clave] || {}; });

    // brigada
    const brig = (entrada.brigada || []).filter(b => !blank(b.nombre));
    const insts = new Set(brig.map(b => b.inst).filter(x => !blank(x)));

    return { datos, obs, S, sug, mods, m16: mods[15], tot, clasif: C, inds, cuentaInd, plan, brigada: brig, instituciones: insts.size, defs };
  }

  const api = { calcular, obsDefs, filaObs, RESP };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Motor = api;
})(this);

<script>/* Cédula UCIN · IAAS y RAM — aplicación de captura (HGR Reynosa) */
(function () {
  'use strict';
  const DATA = window.CEDULA_DATA;
  const LOGO = window.CEDULA_LOGO;
  const L = DATA.listas;
  const DEFS = Motor.obsDefs(L);
  const OBS_TIPOS = ['HM', 'CVC', 'VM', 'AMB', 'ATB', 'CENSO'];
  const DEFAULT_URL = window.CEDULA_URL || '';

  // ---------------- almacenamiento local ----------------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },

  const saveDB = () => { LS.set('cedula.db', DB); LS.set('cedula.outbox', OUTBOX); };
  const saveCFG = () => LS.set('cedula.cfg', CFG);

  const keyOf = r => r.v + '|' + r.t + '|' + r.k;
  function put(v, t, k, d, val, del) {
    const rec = { v, t, k: String(k), d: d || {}, val: val || '', u: CFG.evaluador || '', ts: Math.max(Date.now(), ((DB.recs[v + '|' + t + '|' + k] || {}).ts || 0) + 1), del: del ? 1 : 0 };
    DB.recs[keyOf(rec)] = rec;

  // ---------------- sincronización ----------------
  let syncTimer = null, syncing = false, ultimoError = '', ultimaSync = 0, pendienteRender = false;
  function programarSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sincronizar, ms); }
  async function sincronizar() {
    if (!CFG.url) { estadoSync(); return; }
    if (syncing) { programarSync(2000); return; }
    if (!navigator.onLine) { ultimoError = 'Sin conexión'; estadoSync(); programarSync(20000); return; }
    syncing = true; estadoSync();
    const enviados = Object.values(OUTBOX).slice(0, 400);
    try {
      const resp = await fetch(CFG.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', token: CFG.token, since: DB.rev || 0, records: enviados }) });
      const j = await resp.json();
      if (!j.ok) throw new Error(j.error || 'Error del servidor');
      enviados.forEach(r => { const o = OUTBOX[keyOf(r)]; if (o && o.ts === r.ts) delete OUTBOX[keyOf(r)]; });
      let cambios = 0;
      (j.records || []).forEach(r => {
        const k = keyOf(r), loc = DB.recs[k];
        if (OUTBOX[k] && OUTBOX[k].ts > r.ts) return;
        if (!loc || r.ts > loc.ts || (r.ts === loc.ts && r.rev && !loc.rev)) { if (!loc || r.ts !== loc.ts || r.del !== loc.del) cambios++; DB.recs[k] = r; }
      });
      DB.rev = Math.max(DB.rev || 0, j.rev || 0);
      saveDB(); ultimoError = ''; ultimaSync = Date.now();
      if (cambios) renderSeguro();
      if (Object.keys(OUTBOX).length) programarSync(500);
    } catch (e) {
      ultimoError = String(e.message || e).includes('Failed to fetch') ? 'No se pudo conectar' : String(e.message || e);
      if (ultimoError === 'Clave de brigada incorrecta' && (S.p === 'inicio' || !S.v)) renderSeguro();

      syncing = false; estadoSync();
      programarSync(Object.keys(OUTBOX).length ? 15000 : 25000);
    }
  }
  function textoSync() {
    const p = Object.keys(OUTBOX).length;
    if (esCap(S.v) && S.p !== 'inicio') return { c: 'local', t: 'Práctica: solo en este equipo' };
    if (!CFG.url) return { c: 'local', t: 'Solo en este dispositivo' };
    if (!CFG.token && (!ultimoError || ultimoError === 'Clave de brigada incorrecta')) return { c: 'busy', t: 'Sin clave' + (p ? ' · ' + p + ' sin enviar' : '') };
    if (syncing) return { c: 'busy', t: 'Sincronizando…' };
    if (ultimoError) return { c: 'err', t: ultimoError + (p ? ' · ' + p + ' sin enviar' : '') };
    if (p) return { c: 'busy', t: p + ' cambio(s) por enviar' };
    return { c: 'ok', t: 'Guardado en la nube' };
  }
  function estadoSync() { const el = document.getElementById('sync'); if (el) { const s = textoSync(); el.className = 'sync ' + s.c; el.textContent = s.t; } }
  window.addEventListener('online', () => programarSync(300));

  // ---------------- utilidades ----------------
  const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (v, d) => (v === '' || v === undefined || v === null ? '—' : (v * 100).toFixed(d === undefined ? 0 : d) + '%');
  const fmt = v => (v === '' || v === undefined || v === null ? '—' : (Number.isInteger(v) ? String(v) : Number(v).toFixed(1)));
  const hoy = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const fechaLarga = f => { if (!f) return '—'; const [y, m, d] = f.split('-'); return d + '/' + m + '/' + y; };

  const semCls = s => ({ VERDE: 'v', AMARILLO: 'a', ROJO: 'r', 'SIN EVALUAR': 'g', 'SIN DATO': 'g', 'CAPTURE BASAL': 'g', INFORMATIVO: 'i' }[s] || 'g');
  const chip = s => '<span class="sem ' + semCls(s) + '">' + esc(s) + '</span>';
  const impactoTxt = i => ({ 3: 'Impacto alto', 2: 'Impacto medio', 1: 'Soporte' }[i]);
  function hora(ts) { if (!ts) return ''; const d = new Date(ts); return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); }

  // ---------------- modelo de visita ----------------
  const CAMPOS_DATOS = [
    { k: 'inst', l: 'Institución', op: L.inst },
    { k: 'hospital', l: 'Hospital / unidad médica', tipo: 'text' },
    { k: 'clues', l: 'CLUES', tipo: 'text' },
    { k: 'entidad', l: 'Entidad federativa', op: L.entidad },

    { k: 'jefeUcin', l: 'Jefe(a) de la UCIN', tipo: 'text' },
    { k: 'uveh', l: 'Responsable de UVEH / PCI', tipo: 'text' },

    { k: 'instCoord', l: 'Institución que coordina la visita', op: L.inst, nota: 'Debe ser distinta a la del hospital (reactivo GI-15).' },

  ];
  const DEF_DATOS = { inst: 'IMSS-Bienestar', hospital: 'Hospital General Reynosa "Dr. José María Cantú Garza"', clues: 'TSIMB001260', entidad: 'Tamaulipas', municipio: 'Reynosa', director: 'Dr. Néstor Carlos García Prugue', brote: 'No' };

  function entradaDe(v) {
    const e = { datos: {}, resp: {}, obs: {}, ind: {}, plan: {}, brigada: [], asig: {} };
    recs(v, 'dato').forEach(r => { e.datos[r.k] = r.d.v; });
    recs(v, 'resp').forEach(r => { e.resp[r.k] = { r: r.d.r || '', obs: r.d.obs || '', u: r.u, ts: r.ts }; });
    OBS_TIPOS.forEach(t => e.obs[t] = []);
    recs(v, 'obs').sort((a, b) => (a.d.n || a.ts) - (b.d.n || b.ts)).forEach(r => { if (e.obs[r.d.f]) e.obs[r.d.f].push(Object.assign({ _id: r.k, _u: r.u, _ts: r.ts }, r.d)); });
    recs(v, 'ind').forEach(r => { e.ind[r.k] = r.d; });
    recs(v, 'plan').forEach(r => { e.plan[r.k] = r.d; });
    recs(v, 'brig').sort((a, b) => (a.d.n || 0) - (b.d.n || 0)).forEach(r => e.brigada.push(Object.assign({ _id: r.k }, r.d)));
    recs(v, 'asig').forEach(r => { if (r.d.quien) e.asig[r.k] = r.d.quien; });
    return e;
  }
  const cache = {};
  function calc(v) {
    const sig = Object.values(DB.recs).filter(r => r.v === v).reduce((a, r) => Math.max(a, r.ts), 0) + ':' + Object.values(DB.recs).filter(r => r.v === v).length;
    if (cache[v] && cache[v].sig === sig) return cache[v].r;
    const e = entradaDe(v);
    const r = Motor.calcular(DATA, e);
    r.entrada = e;
    cache[v] = { sig, r };
    return r;
  }
  function visitas() {
    return Object.values(DB.recs).filter(r => r.t === 'visita' && r.k === 'meta' && !r.del).map(r => {
      const d = {}; recs(r.v, 'dato').forEach(x => d[x.k] = x.d.v);
      return { id: r.v, creado: r.d.creado, por: r.u, fecha: d.fecha || '', tipo: d.tipo || '', estado: r.d.estado || 'abierta', cap: esCap(r.v) };
    }).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.creado - a.creado);
  }

  // ---------------- navegación ----------------
  let S = { p: 'inicio' };
  function leerHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    S = { p: h.get('p') || 'inicio', v: h.get('v') || null, m: h.get('m') || null, t: h.get('t') || null };
  }
  function ir(params) { const h = new URLSearchParams(); Object.entries(params).forEach(([k, v]) => { if (v) h.set(k, v); }); location.hash = h.toString(); }
  window.addEventListener('hashchange', () => { leerHash(); editObs = null; render(); window.scrollTo(0, 0); });

  // ---------------- render ----------------
  const $app = () => document.getElementById('app');
  function renderSeguro() {
    const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'button')) && $app().contains(a)) { pendienteRender = true; return; }
    render(true);
  }
  document.addEventListener('focusout', () => setTimeout(() => { if (pendienteRender) { pendienteRender = false; renderSeguro(); } }, 300));

  function render(conservarScroll) {
    const y = window.scrollY;
    let html;
    try {
      if (S.p === 'inicio' || !S.v || !rec(S.v, 'visita', 'meta')) html = vInicio();
      else html = vVisita();
    } catch (err) { console.error(err); html = '<div class="card err">Ocurrió un error al mostrar esta pantalla: ' + esc(err.message) + '</div>'; }
    $app().innerHTML = html;
    document.body.classList.toggle('modo-reporte', S.p === 'reporte');
    estadoSync();
    if (conservarScroll) window.scrollTo(0, y);
  }

  function barra(titulo, sub, atras, extra) {
    return '<header class="top no-print"><div class="top-in">' +
      (atras ? '<a class="back" href="#' + atras + '" aria-label="Regresar">‹</a>' : '<img class="logo-s" src="' + LOGO + '" alt="IMSS Bienestar">') +
      '<div class="tt"><div class="t1">' + esc(titulo) + '</div>' + (sub ? '<div class="t2">' + sub + '</div>' : '') + '</div>' +
      '<div id="sync" class="sync"></div></div>' + (extra || '') + '</header>';
  }

  // ---------- Inicio ----------
  function vInicio() {
    if (S.p === 'config') return vConfig();
    if (S.p === 'historial') return vHistorial();
    const vs = visitas();
    let h = barra('Cédula UCIN · IAAS y RAM', 'HGR Reynosa "Dr. José María Cantú Garza"');
    h += '<main class="wrap">';
    if (!CFG.evaluador) h += '<div class="card aviso"><b>¿Quién está capturando?</b> Escriba su nombre para que quede registrado en cada respuesta.<div class="row"><input id="nomEval" placeholder="Nombre y apellido"><button class="btn pri" data-a="guardarNombre">Guardar</button></div></div>';
    else h += '<div class="quien">Capturando como <b>' + esc(CFG.evaluador) + '</b> · <a href="#p=config">cambiar</a></div>';
    if (CFG.url && !CFG.token) h += '<div class="card aviso"><b>Escriba la clave de la brigada</b> para guardar en la hoja compartida (se la da el coordinador).<div class="row"><input id="claveBrig" placeholder="Clave"><button class="btn pri" data-a="guardarClave">Guardar</button></div></div>';
    else if (ultimoError === 'Clave de brigada incorrecta') h += '<div class="card aviso"><b>La clave de la brigada no es correcta.</b> Corríjala:<div class="row"><input id="claveBrig" placeholder="Clave"><button class="btn pri" data-a="guardarClave">Guardar</button></div></div>';
    if (!CFG.url) h += '<div class="card aviso2">Sin servidor configurado: los datos se guardan solo en este dispositivo. Para trabajar entre varios y conservar el historial, configure la conexión en <a href="#p=config">Configuración</a>.</div>';
    h += '<div class="acciones"><button class="btn pri grande" data-a="nuevaVisita">＋ Nueva visita</button><button class="btn grande cap-b" data-a="nuevaCap">🎓 Visita de capacitación</button><a class="btn" href="#p=historial">Historial y tendencia</a><a class="btn" href="#p=config">Configuración</a></div>';
    h += '<h2>Visitas</h2>';
    if (!vs.length) h += '<p class="muted">Todavía no hay visitas registradas.</p>';
    vs.forEach(v => {
      const r = calc(v.id);
      h += '<a class="card visita' + (v.cap ? ' cap' : '') + '" href="#p=panel&v=' + v.id + '"><div><div class="vf">' + (v.cap ? '<span class="tag cap-t">Capacitación · solo en este equipo</span> ' : '') + fechaLarga(v.fecha) + ' · ' + esc(v.cap ? 'Práctica' : (v.tipo || 'Visita')) + '</div>' +
        '<div class="muted small">' + r.tot.contestados + ' de ' + r.tot.reactivos + ' reactivos · cumplimiento ' + pct(r.tot.pct) + (r.clasif.codigo ? ' · ' + esc(r.clasif.codigo) : '') + '</div></div>' + chip(r.tot.sem) + '</a>';
    });
    h += '</main>';
    return h;
  }

  function vConfig() {
    let h = barra('Configuración', '', 'p=inicio');
    h += '<main class="wrap"><div class="card"><label>Su nombre (aparece en cada respuesta)<input data-cfg="evaluador" value="' + esc(CFG.evaluador) + '"></label>' +
      '<div class="fld"><div class="lb">Servidor</div><div class="small">' + (CFG.url ? '✓ Hoja compartida del HGR Reynosa (fijo; solo el administrador lo cambia)' : 'Sin servidor: los datos se guardan solo en este equipo.') + '</div></div>' +
      '<label>Clave de la brigada (si se configuró TOKEN)<input data-cfg="token" value="' + esc(CFG.token) + '"></label>' +
      '<div class="row"><button class="btn pri" data-a="probar">Guardar y probar conexión</button><span id="prueba" class="muted"></span></div></div>' +
      '<div class="card"><h3>Respaldo</h3><p class="muted small">Exporte un respaldo de todo lo capturado en este dispositivo o importe uno.</p><div class="row"><button class="btn" data-a="respaldo">Descargar respaldo (.json)</button><label class="btn">Importar respaldo<input type="file" accept=".json" id="importar" hidden></label></div></div>' +
      '<div class="card"><h3>Borrar datos de este dispositivo</h3><p class="muted small">Úselo para quitar pruebas antes de conectar la app o al prestar el equipo. No borra nada de la hoja de Google.</p><button class="btn" data-a="borrarLocal">Borrar datos de este dispositivo</button></div>' +
      '<div class="card"><h3>Estado</h3><p class="small">Registros en este dispositivo: ' + Object.keys(DB.recs).length + ' · Pendientes de enviar: ' + Object.keys(OUTBOX).length + (ultimaSync ? ' · Última sincronización: ' + hora(ultimaSync) : '') + '</p></div></main>';
    return h;
  }

  // ---------- Historial ----------
  function vHistorial() {
    const vs = visitas().filter(v => !v.cap).slice().reverse();
    let h = barra('Historial y tendencia', 'Visitas a la UCIN', 'p=inicio');
    h += '<main class="wrap">';
    if (vs.length < 1) return h + '<p class="muted">No hay visitas.</p></main>';
    const rs = vs.map(v => ({ v, r: calc(v.id) }));
    const pts = rs.filter(x => x.r.tot.pct !== '');
    if (pts.length) {
      const W = 640, H = 200, pad = 34;
      const x = i => pad + (pts.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (pts.length - 1));
      const y = p => H - pad - p * (H - 2 * pad);
      let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="graf" role="img" aria-label="Cumplimiento global por visita">';
      [0, 0.5, 0.7, 0.85, 1].forEach(g => { svg += '<line x1="' + pad + '" x2="' + (W - pad) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="gl"/><text x="4" y="' + (y(g) + 4) + '" class="gt">' + Math.round(g * 100) + '%</text>'; });
      svg += '<polyline fill="none" class="ln" points="' + pts.map((p, i) => x(i) + ',' + y(p.r.tot.pct)).join(' ') + '"/>';
      pts.forEach((p, i) => { svg += '<circle cx="' + x(i) + '" cy="' + y(p.r.tot.pct) + '" r="5" class="pt ' + semCls(p.r.tot.sem) + '"/><text x="' + x(i) + '" y="' + (y(p.r.tot.pct) - 10) + '" text-anchor="middle" class="pl">' + pct(p.r.tot.pct) + '</text><text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" class="gt">' + fechaLarga(p.v.fecha).slice(0, 5) + '</text>'; });
      svg += '</svg>';
      h += '<div class="card"><h3>Cumplimiento global (módulos 1 a 15)</h3>' + svg + '</div>';
    }
    h += '<div class="card scroll"><h3>Cumplimiento por módulo</h3><table class="tbl"><thead><tr><th>Módulo</th>' + rs.map(x => '<th>' + fechaLarga(x.v.fecha) + '</th>').join('') + '</tr></thead><tbody>';
    DATA.modulos.forEach((m, i) => {
      h += '<tr><td>' + m.id + ' · ' + esc(m.nombre) + '</td>' + rs.map(x => { const md = x.r.mods[i]; return '<td class="c cel-' + semCls(md.sem) + '">' + pct(md.pct) + '</td>'; }).join('') + '</tr>';
    });
    h += '<tr class="tot"><td>Global</td>' + rs.map(x => '<td class="c cel-' + semCls(x.r.tot.sem) + '">' + pct(x.r.tot.pct) + '</td>').join('') + '</tr>';
    h += '<tr><td>Código del hospital</td>' + rs.map(x => '<td class="c small">' + esc(x.r.clasif.codigo || '—') + '</td>').join('') + '</tr>';
    h += '<tr><td>Acciones del plan (cerradas)</td>' + rs.map(x => { const c = x.r.plan.filter(p => p.seg.estatus === 'Cerrada' || p.seg.estatus === 'Verificada por el grupo').length; return '<td class="c">' + x.r.plan.length + ' (' + c + ')</td>'; }).join('') + '</tr>';
    h += '</tbody></table></div></main>';
    return h;
  }

  // ---------- Visita ----------
  const PESTANAS = [['panel', 'Módulos'], ['datos', 'Datos'], ['obs', 'Observación'], ['ind', 'Indicadores'], ['resumen', 'Resumen'], ['plan', 'Plan'], ['reporte', 'Reporte']];
  function vVisita() {
    const r = calc(S.v);
    const d = r.entrada.datos;
    if (S.p === 'reporte') return vReporte(r);
    const tabs = '<nav class="tabs no-print">' + PESTANAS.map(([p, l]) => '<a href="#p=' + p + '&v=' + S.v + '" class="' + ((S.p === p || (p === 'panel' && S.p === 'modulo')) ? 'on' : '') + '">' + l + '</a>').join('') + '</nav>';
    let h = barra('Visita ' + fechaLarga(d.fecha), esc(d.tipo || '') + ' · ' + chip(r.tot.sem), 'p=inicio', tabs);
    h += '<main class="wrap">';
    if (!CFG.evaluador) h += '<div class="card aviso"><b>¿Quién está capturando?</b> ' + (r.brigada.length ? r.brigada.map(b => '<button class="chipb" data-a="soy" data-n="' + esc(b.nombre) + '">' + esc(b.nombre) + '</button>').join(' ') : '') + '<div class="row"><input id="nomEval" placeholder="Nombre y apellido"><button class="btn pri" data-a="guardarNombre">Guardar</button></div></div>';
    if (esCap(S.v)) h += '<div class="card capban"><b>🎓 Visita de capacitación.</b> Solo existe en este equipo: nada se envía a la hoja compartida y nadie más la ve. Practique con libertad; al terminar puede eliminarla en <b>Datos</b>.' + (r.tot.contestados === 0 ? '<div class="row"><button class="btn" data-a="ejemplo">Llenar con respuestas de ejemplo</button><span class="muted xs">Útil para ver el resumen, el plan y el reporte completos.</span></div>' : '') + '</div>';
    const vistas = { panel: vPanel, modulo: vModulo, datos: vDatos, obs: vObs, ind: vInd, resumen: vResumen, plan: vPlan };
    h += (vistas[S.p] || vPanel)(r);
    h += '</main>';
    return h;
  }

  function vPanel(r) {
    let h = '<div class="card global"><div class="gl1">' + chip(r.tot.sem) + '<div><div class="big">' + pct(r.tot.pct) + '</div><div class="muted small">cumplimiento global (M01–M15)</div></div></div>' +
      '<div class="gl2"><div><b>' + r.tot.contestados + '</b> de ' + r.tot.reactivos + '<span>reactivos</span></div><div><b class="' + (r.tot.critNo ? 'txt-r' : '') + '">' + r.tot.critNo + '</b><span>críticos no cumplidos</span></div><div><b>' + r.plan.length + '</b><span>acciones</span></div></div></div>';
    const filtro = LS.get('cedula.filtro', 'todos');
    h += '<div class="row filtros"><span class="muted small">Ver:</span>' + [['todos', 'Todos'], ['mios', 'Mis módulos'], ['libres', 'Sin asignar']].map(([k, l]) => '<button class="chipb ' + (filtro === k ? 'on' : '') + '" data-a="filtro" data-f="' + k + '">' + l + '</button>').join('') + '</div>';
    h += '<div class="grid">';
    r.mods.forEach(m => {
      const quien = r.entrada.asig[m.id] || '';
      if (filtro === 'mios' && quien !== CFG.evaluador) return;
      if (filtro === 'libres' && quien) return;
      const av = m.total ? m.contestados / m.total : 0;
      h += '<div class="card mod"><a class="mod-a" href="#p=modulo&v=' + S.v + '&m=' + m.id + '"><div class="mh"><span class="mid">' + m.id + '</span>' + chip(m.sem) + '</div><div class="mn">' + esc(m.nombre) + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(av * 100) + '%"></i></div><div class="muted small">' + m.contestados + ' de ' + m.total + ' · ' + pct(m.pct) + (m.critNo ? ' · <b class="txt-r">' + m.critNo + ' crítico(s)</b>' : '') + '</div></a>' +
        '<div class="asig">' + (quien ? '👤 ' + esc(quien) : '<span class="muted">Sin asignar</span>') +
        (quien === CFG.evaluador ? ' <button class="lnk" data-a="asig" data-m="' + m.id + '" data-q="">soltar</button>' : ' <button class="lnk" data-a="asig" data-m="' + m.id + '" data-q="yo">' + (quien ? 'tomarlo' : 'asignármelo') + '</button>') + '</div></div>';
      if (m.id === 'M15') h += '</div><h3 class="sep">Se califica aparte</h3><div class="grid">';
    });
    h += '</div>';
    return h;
  }

  function tarjetaReactivo(i) {
    const r = i.r;
    let h = '<div class="card rc' + (i.resp ? ' cont' : '') + (i.difiere ? ' dif' : '') + '" id="rc-' + r.clave + '">' +
      '<div class="rh"><span class="clave">' + r.clave + '</span>' + (r.critico ? '<span class="tag crit">Crítico</span>' : '') + '<span class="tag">' + impactoTxt(r.impacto) + '</span>' + (r.naPrevisto ? '<span class="tag">N/A previsto</span>' : '') + '</div>' +
      '<div class="crit-t">' + esc(r.criterio) + '</div>' +
      '<div class="cumple"><b>Cumple si:</b> ' + esc(r.cumpleSi) + '</div>' +
      '<div class="verif">Cómo verificar: <b>' + esc(r.verificar) + '</b></div>';
    if (i.sug) h += '<div class="sug' + (i.difiere ? ' dif' : '') + '">Según la observación: <b>' + esc(i.sug) + '</b>' + (i.difiere ? ' — no coincide con su respuesta, revísela.' : '') + '</div>';
    h += '<div class="resp">' + Motor.RESP.map(o => '<button class="rb ' + ({ 'Cumple': 'c', 'Parcial': 'p', 'No cumple': 'n', 'No aplica': 'na' }[o]) + (i.resp === o ? ' on' : '') + '" data-a="resp" data-k="' + r.clave + '" data-r="' + o + '">' + o + '</button>').join('') + '</div>';
    if (i.alerta) h += '<div class="alerta">⚠ ' + esc(i.alerta) + '</div>';
    h += '<textarea class="obs" data-k="' + r.clave + '" rows="2" placeholder="Observaciones / evidencia">' + esc(i.obs) + '</textarea>';
    if (i.mejora) h += '<div class="recom"><b>Recomendación (' + esc(r.plazo) + '):</b> ' + esc(r.recomendacion) + '</div>';
    if (i.quien) h += '<div class="muted xs">Respondió ' + esc(i.quien) + ' · ' + hora(i.ts) + '</div>';
    return h + '</div>';
  }

  function cabModulo(m, r) {
    const quien = r.entrada.asig[m.id] || '';
    return '<div class="card modh" id="modh"><div class="mh"><span class="mid">' + m.id + '</span>' + chip(m.sem) + '</div><h2>' + esc(m.nombre) + '</h2><p class="muted small">' + esc(m.objetivo) + '</p>' +
      '<div class="gl2"><div><b>' + m.contestados + '</b> de ' + m.total + '<span>contestados</span></div><div><b>' + pct(m.pct) + '</b><span>cumplimiento</span></div><div><b class="' + (m.critNo ? 'txt-r' : '') + '">' + m.critNo + '</b><span>críticos no cumplidos</span></div></div>' +
      '<div class="small">' + (quien ? 'Asignado a <b>' + esc(quien) + '</b>' : 'Sin asignar') + (quien !== CFG.evaluador ? ' · <button class="lnk" data-a="asig" data-m="' + m.id + '" data-q="yo">asignármelo</button>' : '') + '</div></div>';
  }

  function vModulo(r) {
    const idx = r.mods.findIndex(m => m.id === S.m);
    const m = r.mods[idx];
    if (!m) return '<p>Módulo no encontrado.</p>';
    const soloPend = LS.get('cedula.pend', false);
    let h = cabModulo(m, r);
    h += '<div class="row filtros"><label class="chk"><input type="checkbox" data-a="pend" ' + (soloPend ? 'checked' : '') + '> Mostrar solo los pendientes</label></div>';
    m.items.forEach(i => { if (soloPend && i.resp) return; h += tarjetaReactivo(i); });
    const prev = r.mods[idx - 1], next = r.mods[idx + 1];
    h += '<div class="row nav-m">' + (prev ? '<a class="btn" href="#p=modulo&v=' + S.v + '&m=' + prev.id + '">‹ ' + prev.id + '</a>' : '<span></span>') + '<a class="btn" href="#p=panel&v=' + S.v + '">Módulos</a>' + (next ? '<a class="btn" href="#p=modulo&v=' + S.v + '&m=' + next.id + '">' + next.id + ' ›</a>' : '<span></span>') + '</div>';
    return h;
  }

  // ---------- Datos de la visita ----------
  function campo(c, val, attrs) {
    attrs = attrs || '';
    if (c.op) {
      if (c.op.length <= 12 && c.op.every(o => o.length <= 50)) {
        return '<div class="fld"><div class="lb">' + esc(c.l) + '</div><div class="chips">' + c.op.map(o => '<button type="button" class="chipb' + (val === o ? ' on' : '') + '" ' + attrs + ' data-val="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' + (c.nota ? '<div class="muted xs">' + esc(c.nota) + '</div>' : '') + '</div>';
      }
      return '<label class="fld">' + esc(c.l) + '<select ' + attrs + '><option value=""></option>' + c.op.map(o => '<option' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' + (c.nota ? '<span class="muted xs">' + esc(c.nota) + '</span>' : '') + '</label>';
    }
    return '<label class="fld">' + esc(c.l) + '<input type="' + (c.tipo || 'text') + '" ' + (c.tipo === 'number' ? 'inputmode="decimal" step="any"' : '') + ' value="' + esc(val === undefined ? '' : val) + '" ' + attrs + '>' + (c.nota ? '<span class="muted xs">' + esc(c.nota) + '</span>' : '') + '</label>';
  }

  function vDatos(r) {
    const d = r.entrada.datos;
    let h = '<div class="card"><h3>Datos de la unidad y de la visita</h3><div class="form2">';
    CAMPOS_DATOS.forEach(c => {
      if (c.k === 'tipo' && esCap(S.v)) { h += '<div class="fld"><div class="lb">Tipo de visita</div><div><span class="tag cap-t">Capacitación en uso de la App</span></div><span class="muted xs">Una práctica no puede convertirse en visita real.</span></div>'; return; }
      h += campo(c, d[c.k], 'data-a="dato" data-k="' + c.k + '"');
    });
    h += '</div></div>';
    h += '<div class="card"><h3>Brigada (grupo interinstitucional)</h3><p class="muted small">Instituciones distintas: <b>' + r.instituciones + '</b> ' + (r.brigada.length ? (r.instituciones >= 2 ? '· Interinstitucional ✓' : '· <span class="txt-r">Falta otra institución (GI-15)</span>') : '') + '</p>';
    r.entrada.brigada.forEach(b => {

  // ---------- Observación directa ----------
  let editObs = null;
  function vObs(r) {
    const t = S.t || 'HM';
    const def = DEFS[t];
    let h = '<nav class="subtabs">' + OBS_TIPOS.map(x => '<a href="#p=obs&v=' + S.v + '&t=' + x + '" class="' + (x === t ? 'on' : '') + '">' + DEFS[x].corto + ' <span class="cnt">' + r.obs[x].length + '</span></a>').join('') + '</nav>';
    h += '<div class="card"><h3>' + esc(def.nombre) + '</h3><p class="muted small">' + esc(def.ayuda) + '</p>' + resumenObs(t, r) + '</div>';
    const base = editObs && editObs.t === t ? editObs.d : borradorObs(t, r);
    h += '<div class="card form-obs"><h3>' + (editObs && editObs.id ? 'Editar registro' : 'Nuevo registro') + '</h3><div class="form2">';
    def.campos.forEach(c => { h += campo(c, base[c.k], 'data-a="obsf" data-k="' + c.k + '"'); });
    h += '</div><div class="row"><button class="btn pri grande" data-a="obsGuardar">' + (editObs && editObs.id ? 'Guardar cambios' : 'Registrar') + '</button>' + '<button class="btn" data-a="obsCancelar">' + (editObs && editObs.id ? 'Cancelar' : 'Limpiar') + '</button>' + '</div></div>';
    h += '<div class="card scroll"><h3>Registros (' + r.obs[t].length + ')</h3>' + tablaObs(t, r, true) + '</div>';
    return h;
  }
  function borradorObs(t, r) {
    const b = LS.get('cedula.borr.' + S.v + '.' + t, {});
    DEFS[t].campos.forEach(c => { if (c.defVisita && !b[c.k]) b[c.k] = r.entrada.datos.fecha || hoy(); });
    editObs = { t, id: null, d: b };
    return b;
  }
  function tablaObs(t, r, acciones) {
    const def = DEFS[t], rows = r.obs[t];
    if (!rows.length) return '<p class="muted small">Sin registros.</p>';
    const cols = def.campos.filter(c => c.k !== 'fecha' || t !== 'HM');
    let h = '<table class="tbl obs-t"><thead><tr><th>#</th>' + cols.map(c => '<th>' + esc(c.l) + '</th>').join('') + (t === 'CVC' ? '<th>Días</th><th>Umbilical en límite</th>' : '') + (['CVC', 'VM', 'ATB'].includes(t) ? '<th>Paquete / adecuada</th>' : '') + (acciones ? '<th class="no-print"></th>' : '') + '</tr></thead><tbody>';
    rows.forEach((x, n) => {
      h += '<tr><td>' + (n + 1) + '</td>' + cols.map(c => '<td>' + esc(x[c.k]) + '</td>').join('') + (t === 'CVC' ? '<td class="c">' + esc(x.diasInst) + '</td><td class="c">' + esc(x.limite) + '</td>' : '') +
        (['CVC', 'VM', 'ATB'].includes(t) ? '<td class="c cel-' + ({ 'Sí': 'v', 'No': 'r', 'Incompleto': 'a' }[x.estado] || 'g') + '">' + esc(x.estado) + '</td>' : '') +
        (acciones ? '<td class="no-print nowrap"><button class="lnk" data-a="obsEdit" data-id="' + x._id + '">editar</button> <button class="lnk txt-r" data-a="obsDel" data-id="' + x._id + '">borrar</button></td>' : '') + '</tr>';
    });
    return h + '</tbody></table>';
  }
  function kv(pares) { return '<div class="kvs">' + pares.map(([l, v, c]) => '<div class="kv ' + (c || '') + '"><b>' + v + '</b><span>' + esc(l) + '</span></div>').join('') + '</div>'; }
  function resumenObs(t, r) {
    const s = r.S[t];
    if (t === 'HM') {
      let h = kv([['Oportunidades', s.oport], ['Con higiene', s.conHigiene], ['Apego', pct(s.apego), s.apego === '' ? '' : (s.apego >= 0.9 ? 'okk' : s.apego >= 0.8 ? 'mid' : 'bad')], ['Guantes sin higiene', s.guantes], ['Turnos distintos', s.turnos]]);
      if (s.oport) h += '<details><summary>Apego por categoría y por momento</summary><div class="two"><table class="tbl"><tr><th>Categoría</th><th>Oport.</th><th>Apego</th></tr>' + s.porCategoria.filter(x => x.o).map(x => '<tr><td>' + esc(x.c) + '</td><td class="c">' + x.o + '</td><td class="c">' + pct(x.a) + '</td></tr>').join('') + '</table><table class="tbl"><tr><th>Momento</th><th>Oport.</th><th>Apego</th></tr>' + s.porMomento.filter(x => x.o).map(x => '<tr><td>' + esc(x.c) + '</td><td class="c">' + x.o + '</td><td class="c">' + pct(x.a) + '</td></tr>').join('') + '</table></div></details>';
      return h;
    }
    if (t === 'CVC') return kv([['Auditados (completos)', s.auditados], ['Paquete completo', s.completo], ['Apego todo o nada', pct(s.apego)], ['Umbilicales fuera de límite', s.fueraLimite]]) + '<div class="muted xs">% Sí por elemento: necesidad ' + pct(s.elem.nec) + ' · apósito ' + pct(s.elem.apo) + ' · conector ' + pct(s.elem.des) + ' · equipos ' + pct(s.elem.equ) + ' · higiene ' + pct(s.elem.hm) + '</div>';
    if (t === 'VM') return kv([['Auditados (completos)', s.auditados], ['Paquete completo', s.completo], ['Apego todo o nada', pct(s.apego)]]);
    if (t === 'AMB') return kv([['Superficies evaluadas', s.evaluadas], ['Conformes', s.conformes], ['% conforme', pct(s.pct)]]);
    if (t === 'ATB') return kv([['Pacientes', s.pacientes], ['Prescripción adecuada', pct(s.adecuada)], ['Revaloración 36–48 h', s.revalSi + '/' + s.revalEval], ['Hemocultivo ≥1 mL', s.hcSi + '/' + s.hcEval], ['Continúa sin justificación', s.contSi + '/' + s.contEval]]);
    if (t === 'CENSO') return kv([['Pacientes', s.total], ['Con catéter central', s.cvc], ['Con VM invasiva', s.vm], ['Con antimicrobiano', s.atb], ['IBP/anti-H2 sin indicación', s.ibpSin], ['Leche humana', s.lh + '/' + s.alimentados], ['Calostro ≤24 h', s.calostro24 + '/' + s.elegCalostro], ['Horas piel a piel (prom.)', fmt(s.horasProm)], ['Con madre o padre', s.padres]]);
    return '';
  }

      const cap = r.entrada.ind[d.codigo] || {};
      h += '<div class="card ind"><div class="rh"><span class="clave">' + d.codigo + '</span>' + (d.auto ? '<span class="tag">automático</span>' : '') + chip(i.sem) + '</div><div class="crit-t">' + esc(d.nombre) + '</div><div class="muted small">' + esc(d.calculo) + ' · Meta: <b>' + esc(d.meta) + '</b></div>';

      else h += '<label>Numerador<input type="number" inputmode="decimal" step="any" value="' + esc(cap.num) + '" data-a="ind" data-c="' + d.codigo + '" data-k="num"></label>' + (d.soloNumerador ? '' : '<label>Denominador<input type="number" inputmode="decimal" step="any" value="' + esc(cap.den) + '" data-a="ind" data-c="' + d.codigo + '" data-k="den"></label>');
      if (d.regla !== 'INFO') h += '<label>Línea basal<input type="number" inputmode="decimal" step="any" value="' + esc(cap.basal) + '" data-a="ind" data-c="' + d.codigo + '" data-k="basal"></label>';
      h += '<div class="kv res"><b>' + fmt(i.res) + '</b><span>' + esc(d.unidad) + (i.cambio !== '' ? ' · ' + (i.cambio > 0 ? '+' : '') + pct(i.cambio) + ' vs. basal' : '') + '</span></div></div>';
      if (i.recomendacion) h += '<div class="recom">' + esc(i.recomendacion) + '</div>';
      h += '</div>';
    });
    return h;
  }

  // ---------- Resumen ----------
  function tablaModulos(r, comp) {
    let h = '<table class="tbl"><thead><tr><th>Módulo</th><th>Contestados</th><th>Puntos</th><th>% cumplimiento</th>' + (comp ? '<th>Visita previa</th>' : '') + '<th>Críticos no cumplidos</th><th>Semáforo</th></tr></thead><tbody>';
    const fila = (m, i) => '<tr><td>' + m.id + ' · ' + esc(m.nombre) + '</td><td class="c">' + m.contestados + ' / ' + m.total + '</td><td class="c">' + fmt(m.obt) + ' / ' + fmt(m.pos) + '</td><td class="c b">' + pct(m.pct) + '</td>' + (comp ? '<td class="c">' + pct(comp.mods[i].pct) + '</td>' : '') + '<td class="c' + (m.critNo ? ' txt-r b' : '') + '">' + m.critNo + '</td><td class="c cel-' + semCls(m.sem) + '">' + esc(m.sem) + '</td></tr>';
    r.mods.slice(0, 15).forEach((m, i) => { h += fila(m, i); });

  function tablaClasif(r) {
    const C = r.clasif;

      ['Nivel de desempeño global', C.desempeno || '—'], ['A. Complejidad de la UCIN', C.complejidad], ['B. Madurez del PCI', C.pci || '—'], ['C. Madurez del PROA', C.proa],
